<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1326">
<title>Sushree AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#07101e;color:#f5f7fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100dvh;display:flex;justify-content:center;overflow:hidden}
.app{width:min(100%,760px);height:100dvh;padding:10px 14px 12px;display:flex;flex-direction:column}
.panel{height:100%;border:1px solid rgba(96,231,255,.18);border-radius:34px;background:#0d1629;box-shadow:0 0 45px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden}
header{text-align:center;padding:30px 18px 12px}
h1{margin:0;color:#56e5ff;font-size:39px;line-height:1.05;font-weight:800}
.subtitle{margin-top:8px;color:#9ba8bf;font-size:20px}
.hero{text-align:center;padding:14px 12px 4px}
.avatar-wrap{width:220px;height:220px;margin:auto;border-radius:50%;padding:4px;position:relative;background:#58e8ff;box-shadow:0 0 20px rgba(73,225,255,.45),0 0 65px rgba(73,225,255,.13);animation:breath 3.2s ease-in-out infinite}
.avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 35%;display:block;background:#151b29}
@keyframes breath{0%,100%{transform:scale(1);box-shadow:0 0 18px rgba(73,225,255,.38),0 0 55px rgba(73,225,255,.10)}50%{transform:scale(1.035);box-shadow:0 0 28px rgba(73,225,255,.62),0 0 85px rgba(73,225,255,.18)}}
.status{margin-top:14px;color:#59e4ff;font-size:19px;min-height:27px}
.status.listening{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.45}}
.chat{flex:1;overflow-y:auto;padding:22px 34px 14px;scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:4px}.chat::-webkit-scrollbar-thumb{background:#26364e;border-radius:10px}
.row{display:flex;margin:10px 0}.row.user{justify-content:flex-end}
.bubble{max-width:min(86%,560px);padding:14px 18px;border-radius:20px;background:#202c42;color:#f1f4f9;font-size:17px;line-height:1.45;white-space:pre-wrap}
.user .bubble{background:#173d4b}
.meta{font-size:10px;opacity:.45;margin-top:6px;text-align:right}
.composer-area{padding:4px 28px 0}
.composer{height:72px;border:1px solid #2a3b56;border-radius:38px;display:flex;align-items:center;padding:6px 8px 6px 20px;background:#0c1629}
input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font-size:18px}
input::placeholder{color:#7d8aa0}
.action{width:58px;height:58px;border:0;border-radius:50%;background:#55e5ff;color:#07101e;font-size:25px;display:grid;place-items:center;box-shadow:0 0 22px rgba(85,229,255,.35);cursor:pointer}
.action.stop{background:#ff6b83;color:white}
.action.send{font-size:27px}
footer{text-align:center;color:#6f7e97;font-size:13px;padding:15px 10px 20px}
.memory{font-size:11px;color:#53627a;text-align:center;margin-top:2px}
@media(max-width:520px){
 .app{padding:0;height:100dvh}.panel{border-radius:0;border-left:0;border-right:0}
 header{padding-top:20px}h1{font-size:30px}.subtitle{font-size:16px}
 .avatar-wrap{width:190px;height:190px}.chat{padding:14px 20px 10px}.bubble{font-size:16px}
 .composer-area{padding:4px 16px 0}.composer{height:62px}input{font-size:16px}.action{width:50px;height:50px}
 footer{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="app"><div class="panel">
<header>
  <h1>Sushree AI</h1>
  <div class="subtitle">Your interactive digital companion</div>
</header>

<section class="hero">
  <div class="avatar-wrap" id="avatarWrap">
    <img class="avatar" src="sushree.png" alt="Sushree">
  </div>
  <div class="status" id="status">Ready to listen</div>
</section>

<main class="chat" id="chat"></main>

<div class="composer-area">
  <div class="composer">
    <input id="input" autocomplete="off" placeholder="Talk to Sushree..." />
    <button class="action" id="action" aria-label="Speak">🎙️</button>
  </div>
</div>

<footer>Sushree AI • Designed &amp; Evolved by Sukesh ✨</footer>
<div class="memory" id="memory"></div>
</div></div>

<script>
/* =========================================================
   SUSHREE AI — restored core
   Memory + localStorage + breathing + Send/Mic/Stop states
   ========================================================= */

const input = document.getElementById("input");
const chat = document.getElementById("chat");
const statusText = document.getElementById("status");
const action = document.getElementById("action");
const memoryLabel = document.getElementById("memory");

const KEYS = {
  history: "sushree_history_v1",
  memory: "sushree_memory_v1"
};

let history = load(KEYS.history, []);
let memory = load(KEYS.memory, {name:"", important:[]});
let recognition = null;
let listening = false;
let speaking = false;

function load(key, fallback){
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
  catch { return fallback; }
}
function save(key, value){
  localStorage.setItem(key, JSON.stringify(value));
}

function timeNow(){
  return new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
}
function escapeHTML(s){
  const d=document.createElement("div"); d.textContent=s; return d.innerHTML;
}
function scrollDown(){ requestAnimationFrame(()=>chat.scrollTop=chat.scrollHeight); }

function addMessage(text, who, saveIt=true){
  const row=document.createElement("div");
  row.className="row "+(who==="user"?"user":"sushree");
  const bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.innerHTML=escapeHTML(text);
  const meta=document.createElement("div");
  meta.className="meta"; meta.textContent=timeNow();
  bubble.appendChild(meta); row.appendChild(bubble); chat.appendChild(row);
  if(saveIt){
    history.push({role:who==="user"?"user":"assistant",content:text,time:Date.now()});
    save(KEYS.history, history);
  }
  scrollDown();
}

function renderHistory(){
  chat.innerHTML="";
  if(!history.length){
    addMessage("Hello! 👋 I'm Sushree.\nYou can talk to me or type a message.","assistant",false);
  }else{
    history.forEach(m=>addMessage(m.content,m.role==="user"?"user":"assistant",false));
  }
  updateMemoryLabel();
}
function updateMemoryLabel(){
  const bits=[];
  if(memory.name) bits.push("Remembered: "+memory.name);
  if(memory.important.length) bits.push(memory.important.length+" important detail"+(memory.important.length>1?"s":""));
  memoryLabel.textContent=bits.join(" • ");
}

/* -------- memory -------- */
function rememberFrom(text){
  const lower=text.toLowerCase();

  const namePatterns=[
    /(?:my name is|i am|i'm|call me)\s+([a-z][a-z .'-]{1,40})/i
  ];
  for(const re of namePatterns){
    const m=text.match(re);
    if(m && m[1]){
      let n=m[1].trim().replace(/[.!?,]+$/,"");
      if(n.length<41){ memory.name=n; break; }
    }
  }

  if(/remember (that|this)/i.test(text)){
    let detail=text.replace(/^.*?remember\s+(that|this)\s*/i,"").trim();
    if(detail && detail.length<=180 && !memory.important.includes(detail)){
      memory.important.push(detail);
      memory.important=memory.important.slice(-20);
    }
  }
  save(KEYS.memory,memory);
  updateMemoryLabel();
}

function memoryContext(){
  let c="";
  if(memory.name) c+=" The user's name is "+memory.name+".";
  if(memory.important.length) c+=" Important remembered information: "+memory.important.join("; ")+".";
  return c;
}

/* -------- local response engine --------
   Replace generateReply() with your API call later if desired. */
function generateReply(text){
  const t=text.toLowerCase().trim();
  rememberFrom(text);

  if(/^(hi|hello|hey|hii|heyy|namaste)\b/.test(t))
    return memory.name ? `Hello, ${memory.name}! 👋 I'm here. What shall we talk about?` : "Hello! 👋 I'm Sushree.\nYou can talk to me or type a message.";

  if(/what is my name|do you remember my name|my name/.test(t) && memory.name)
    return `Of course. Your name is ${memory.name}. 😊`;

  if(/remember me|what do you remember|memory/.test(t))
    return memory.name || memory.important.length
      ? `I remember${memory.name ? " your name is "+memory.name : ""}${memory.important.length ? " and "+memory.important.length+" important detail"+(memory.important.length>1?"s":"") : ""}. 🧠`
      : "I haven't learned anything important about you yet. Tell me something and say “remember this” if you'd like me to keep it.";

  if(/who are you|your name/.test(t))
    return "I'm Sushree AI — your interactive digital companion. 🪷";

  if(/who made you|who created you|your creator/.test(t))
    return "I was designed and evolved by Sukesh. ✨";

  if(/thank/.test(t))
    return "You're very welcome. 😊 I'm right here whenever you need me.";

  if(/how are you/.test(t))
    return "I'm doing wonderfully — especially now that we're talking. 😊";

  if(/good morning/.test(t)) return "Good morning! ☀️ Ready when you are.";
  if(/good night/.test(t)) return "Good night. 🌙 Take care and rest well.";

  if(/sad|upset|lonely|bad day/.test(t))
    return "I'm here. You don't have to rush to explain everything. Tell me what happened, and I'll listen. 🫂";

  if(/joke/.test(t))
    return "Okay 😏 Why did the computer get cold?\nBecause it left its Windows open. 😂";

  if(/philosophy|meaning of life|existence/.test(t))
    return "That's a beautiful question. Philosophy often begins not by giving an immediate answer, but by examining the assumptions behind the question itself. 🪷";

  return `I hear you. 🪷\n\nYou said: “${text}”\n\nTell me a little more, and I'll think it through with you.${memoryContext()}`;
}

/* -------- speech recognition -------- */
function supportedRecognition(){
  return window.SpeechRecognition || window.webkitSpeechRecognition;
}

function startListening(){
  const SR=supportedRecognition();
  if(!SR){
    setStatus("Voice input isn't supported here.");
    return;
  }

  if(speaking) speechSynthesis.cancel();

  recognition=new SR();
  recognition.lang="en-IN";
  recognition.continuous=false;
  recognition.interimResults=true;
  listening=true;
  setComposer("stop");
  setStatus("Listening...");
  statusText.classList.add("listening");

  recognition.onresult=e=>{
    let transcript="";
    for(let i=e.resultIndex;i<e.results.length;i++)
      transcript+=e.results[i][0].transcript;
    input.value=transcript;
  };

  recognition.onerror=e=>{
    if(e.error!=="aborted") setStatus("I couldn't hear that. Try again?");
    finishListening(false);
  };

  recognition.onend=()=>{
    const text=input.value.trim();
    finishListening(false);
    if(text) sendText();
    else setStatus("Ready to listen");
  };

  try{ recognition.start(); }
  catch(e){ finishListening(false); setStatus("Ready to listen"); }
}

function finishListening(clearButton=true){
  listening=false;
  if(recognition){ try{recognition.stop();}catch(e){} recognition=null; }
  statusText.classList.remove("listening");
  if(clearButton) setComposer(input.value.trim()?"send":"mic");
}

function stopAll(){
  if(listening) finishListening(true);
  if("speechSynthesis" in window) speechSynthesis.cancel();
  speaking=false;
  setComposer(input.value.trim()?"send":"mic");
  setStatus("Ready to listen");
}

/* -------- speech output -------- */
function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/[🪷✨😊😂🥹🫂😏☀️🌙👋🎙️]/g,""));
  u.lang="en-IN"; u.rate=.94; u.pitch=1.03; u.volume=1;
  const voices=speechSynthesis.getVoices();
  u.voice=voices.find(v=>v.lang.toLowerCase().includes("en-in")) || voices.find(v=>v.lang.toLowerCase().startsWith("en")) || null;
  u.onstart=()=>{speaking=true; setStatus("Sushree is speaking..."); setComposer("stop");};
  u.onend=()=>{speaking=false; setStatus("Ready to listen"); setComposer(input.value.trim()?"send":"mic");};
  u.onerror=()=>{speaking=false; setStatus("Ready to listen"); setComposer("mic");};
  speechSynthesis.speak(u);
}

/* -------- composer: MIC / SEND / STOP -------- */
function setComposer(mode){
  action.className="action";
  if(mode==="send"){
    action.classList.add("send"); action.textContent="➤"; action.setAttribute("aria-label","Send");
  }else if(mode==="stop"){
    action.classList.add("stop"); action.textContent="■"; action.setAttribute("aria-label","Stop");
  }else{
    action.textContent="🎙️"; action.setAttribute("aria-label","Speak");
  }
}

function composerAction(){
  if(listening || speaking){ stopAll(); return; }
  if(input.value.trim()){ sendText(); return; }
  startListening();
}

action.addEventListener("click",composerAction);

input.addEventListener("input",()=>{
  if(!listening && !speaking) setComposer(input.value.trim()?"send":"mic");
});
input.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    if(input.value.trim()) sendText();
  }
});

function sendText(){
  const text=input.value.trim();
  if(!text) return;
  if(listening || speaking) stopAll();
  addMessage(text,"user",true);
  input.value="";
  setComposer("stop");
  setStatus("Sushree is thinking...");

  setTimeout(()=>{
    const reply=generateReply(text);
    addMessage(reply,"assistant",true);
    setStatus("Ready to listen");
    speak(reply);
  },350);
}

/* Expose the original-style action for compatibility */
window.composerAction=composerAction;
window.sendText=sendText;
window.stopEverything=stopAll;

/* -------- startup -------- */
renderHistory();
setComposer(input.value.trim()?"send":"mic");

if("speechSynthesis" in window){
  speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
}
</script>
</body>
</html>
