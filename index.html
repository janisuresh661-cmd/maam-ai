<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sushree AI</title>

  <style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(circle at 50% 0%, #243b64 0%, #080b14 55%);
  display: flex;
  justify-content: center;
  align-items: center;
}

.app {
  width: 94%;
  max-width: 520px;
  min-height: 92vh;
  padding: 22px;
  border-radius: 28px;
  background: rgba(15, 23, 42, 0.96);
  border: 1px solid #334155;
  box-shadow: 0 0 50px rgba(92, 232, 255, .12);
  display: flex;
  flex-direction: column;
}

.header {
  text-align: center;
}

.header h1 {
  margin: 5px 0;
  font-size: 32px;
  color: #5ce8ff;
}

.header p {
  margin: 5px 0 18px;
  color: #94a3b8;
}

.character {
  width: 170px;
  height: 170px;
  margin: 5px auto 15px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 80px;
  background: radial-gradient(circle, #334b78, #08111f);
  border: 3px solid #5ce8ff;
  box-shadow: 0 0 35px rgba(92, 232, 255, .35);
  transition: .3s;
    overflow: hidden;
}

.character img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
}
}

.character.listening {
  animation: listenPulse 1.2s infinite;
}

  .character.thinking {
  animation: thinkingPulse 1.5s infinite ease-in-out;
}

@keyframes thinkingPulse {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 0 35px rgba(92, 232, 255, .35);
  }

  50% {
    transform: scale(1.025);
    box-shadow: 0 0 48px rgba(167, 139, 250, .65);
  }
}
.character.speaking {
  animation: speakPulse .45s infinite alternate;
}

@keyframes listenPulse {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 0 35px rgba(92, 232, 255, .35);
  }

  50% {
    transform: scale(1.04);
    box-shadow: 0 0 60px rgba(92, 232, 255, .85);
  }
}

@keyframes speakPulse {
  from {
    transform: scale(1);
    box-shadow: 0 0 35px rgba(92, 232, 255, .35);
  }

  to {
    transform: scale(1.045);
    box-shadow: 0 0 55px rgba(92, 232, 255, .75);
  }
}

.status {
  text-align: center;
  min-height: 22px;
  color: #67e8f9;
  margin-bottom: 12px;
}

.chat {
  flex: 1;
  min-height: 220px;
  max-height: 340px;
  overflow-y: auto;
  padding: 5px;
}

.message {
  padding: 12px 15px;
  margin: 9px 0;
  border-radius: 16px;
  line-height: 1.5;
  max-width: 85%;
}

.sushree {
  background: #1e293b;
  margin-right: 35px;
}

.user {
  background: #164e63;
  margin-left: 35px;
  text-align: right;
}

.input {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 1px solid #334155;
  border-radius: 14px;
  outline: none;
  background: #0f172a;
  color: white;
  font-size: 15px;
}

.controls {
  display: flex;
  gap: 9px;
  margin-top: 10px;
}

button {
  flex: 1;
  border: 0;
  border-radius: 14px;
  padding: 14px;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

.listen {
  background: #2563eb;
  color: white;
}

.send {
  background: #059669;
  color: white;
}

.stop {
  background: #334155;
  color: white;
}

.footer {
  text-align: center;
  margin-top: 14px;
  color: #64748b;
  font-size: 11px;
}
/* Sushree feels alive */
.character {
  animation: naturalBreathing 4s ease-in-out infinite;
}

.character img {
  transition: transform 0.4s ease, filter 0.4s ease;
}

/* Gentle natural breathing */
@keyframes naturalBreathing {
  0%, 100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.015);
  }
}

/* Soft idle glow */
.character:not(.listening):not(.thinking):not(.speaking) {
  box-shadow: 0 0 35px rgba(92, 232, 255, 0.35);
}

/* Thinking state */
.character.thinking img {
  transform: scale(1.02);
  filter: brightness(1.05);
}

/* Speaking state */
.character.speaking img {
  transform: scale(1.025);
  filter: brightness(1.1);
}

/* Listening state */
.character.listening img {
  transform: scale(1.015);
  filter: brightness(1.08);
}
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>Sushree AI</h1>
    <p>Your interactive digital companion</p>
  </div>

  <div id="character" class="character">
    <img src="Sushree.png" alt="Sushree">
  </div>

  <div id="status" class="status">
    Ready to listen
  </div>

  <div id="chat" class="chat">

    <div class="message sushree">
      Hello! 👋 I'm Sushree.<br>
      You can talk to me or type a message.
    </div>

  </div>

  <input
    id="input"
    class="input"
    type="text"
    placeholder="Talk to Sushree..."
  >

  <div class="controls">

    <button class="listen" onclick="listen()">
      🎙️ Speak
    </button>

    <button class="send" onclick="sendText()">
      ➤ Send
    </button>

    <button class="stop" onclick="stopEverything()">
      ⏹ Stop
    </button>

  </div>

<div class="footer">
  Sushree AI • Designed & Evolved by Sukesh ✨
</div>

</div>

<script>

const input = document.getElementById("input");
const chat = document.getElementById("chat");
const statusText = document.getElementById("status");
const character = document.getElementById("character");

let recognition = null;
let history = [];


/* ---------------------------
   ADD MESSAGE
--------------------------- */

function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type;

  message.innerHTML = text
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/^### (.*)$/gm, "<h3>$1</h3>")
    .replace(/^## (.*)$/gm, "<h2>$1</h2>")
    .replace(/^# (.*)$/gm, "<h1>$1</h1>")
    .replace(/\n/g, "<br>");

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}


/* ---------------------------
   SPEECH RECOGNITION
--------------------------- */

function listen() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    statusText.textContent =
      "Speech recognition isn't supported here.";

    return;
  }

  recognition = new SpeechRecognition();

  /*
    We begin with English-India.
    Later, the real AI backend will
    handle automatic multilingual
    understanding.
  */

  recognition.lang = "en-IN";

  recognition.continuous = false;

  recognition.interimResults = false;

  recognition.onstart = function() {

    statusText.textContent =
      "🎙️ Listening...";

    character.classList.add("listening");
  };

  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;

    character.classList.remove("listening");

    input.value = "";

    addMessage(text, "user");

    processMessage(text);
  };

  recognition.onerror = function() {

    character.classList.remove("listening");

    statusText.textContent =
      "I couldn't hear that. Try again.";
  };

  recognition.onend = function() {

    character.classList.remove("listening");
  };

  try {

    recognition.start();

  } catch(error) {

    console.log(error);
  }
}


/* ---------------------------
   TEXT MESSAGE
--------------------------- */

function sendText() {

  const text = input.value.trim();

  if (!text) return;

  input.value = "";

  addMessage(text, "user");

  processMessage(text);
}


/* ---------------------------
   TEMPORARY RESPONSE ENGINE
--------------------------- */

async function processMessage(text) {
  statusText.textContent = "🧠 Thinking...";

  try {
    const response = await fetch(
      "https://spring-cake-3e86.janisuresh661.workers.dev",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
    message: text,
    history: history
})
      }
    );

    const raw = await response.text();

    let data;

    try {
      data = JSON.parse(raw);
    } catch (e) {
      console.error("Invalid JSON from Worker:", raw);
      throw new Error("Worker returned an invalid response.");
    }

    console.log("Worker response:", data);

    if (!response.ok) {
    throw new Error(
        data.details
            ? JSON.stringify(data.details)
            : (data.error || `Worker returned HTTP ${response.status}`)
    );
}

if (data.success && data.reply) {
    history.push({
        role: "user",
        parts: [{ text: text }]
    });

    history.push({
        role: "model",
        parts: [{ text: data.reply }]
    });

    addMessage(data.reply, "assistant");
  speak(data.reply);
} else {
      addMessage(
        data.error || "Sorry, I couldn't get a response right now.",
        "assistant"
      );
    }

  } catch (error) {
    console.error("Sushree API Error:", error);

    addMessage(
      `Sorry, something went wrong: ${error.message}`,
      "assistant"
    );
  }

  statusText.textContent = "🟢 Online";
}
/* ---------------------------
   TEXT TO SPEECH
--------------------------- */

function speak(text) {

    if (!("speechSynthesis" in window)) {
        statusText.textContent = "Speech not supported.";
        return;
    }

    speechSynthesis.cancel();

    // Remove emojis before speaking
    const cleanText = text
        .replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, "")
        .replace(/\s+/g, " ")
        .trim();

    if (!cleanText) return;

    const utterance =
        new SpeechSynthesisUtterance(cleanText);

    utterance.lang = "en-IN";
    utterance.rate = 0.95;
    utterance.pitch = 1.05;
    utterance.volume = 1;

    utterance.onstart = function() {
        statusText.textContent =
            "🔊 Sushree is speaking...";
        character.classList.add("speaking");
    };

    utterance.onend = function() {
        statusText.textContent =
            "Ready to listen";
        character.classList.remove("speaking");
    };

    speechSynthesis.speak(utterance);
}

/* ---------------------------
   STOP
--------------------------- */

function stopEverything() {

  if (recognition) {

    try {
      recognition.stop();
    } catch(error) {}
  }

  speechSynthesis.cancel();

  character.classList.remove("listening");

  character.classList.remove("speaking");

  statusText.textContent =
    "Ready to listen";
}


/* ENTER KEY */

input.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      sendText();

    }

  }
);

</script>

</body>
</html>
