<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Sushree</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", sans-serif;
    background: #0b0d10;
    color: #f4f4f5;
}

body {
    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 700px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: #101318;
}

/* =========================
   HEADER
========================= */

.header {
    padding: 18px 20px 12px;
    text-align: center;
    border-bottom: 1px solid #242830;
}

.header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
}

.header p {
    margin: 5px 0 0;
    font-size: 13px;
    color: #8d949f;
}

/* =========================
   CHARACTER
========================= */

.character-area {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 28px 20px 15px;
}

.character {
    width: 125px;
    height: 125px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #181c23;
    border: 2px solid #303641;
    font-size: 48px;
    transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;
}

.character.thinking {
    animation: thinking 1.3s infinite ease-in-out;
}

.character.listening {
    border-color: #5e9cff;
    box-shadow: 0 0 25px rgba(94,156,255,.25);
    animation: listening 1.2s infinite ease-in-out;
}

.character.speaking {
    border-color: #72d6a0;
    box-shadow: 0 0 30px rgba(114,214,160,.25);
    animation: speaking .8s infinite alternate;
}

@keyframes thinking {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
}

@keyframes listening {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
}

@keyframes speaking {
    from { transform: scale(1); }
    to   { transform: scale(1.07); }
}

/* =========================
   STATUS
========================= */

.status {
    min-height: 42px;
    padding: 8px 20px;
    text-align: center;
    color: #aab0ba;
    font-size: 14px;
}

/* =========================
   CHAT
========================= */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 10px 16px 20px;
    scroll-behavior: smooth;
}

.message {
    max-width: 85%;
    margin: 8px 0;
    padding: 11px 14px;
    border-radius: 16px;
    line-height: 1.45;
    font-size: 15px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.message.user {
    margin-left: auto;
    background: #29313d;
    border-bottom-right-radius: 5px;
}

.message.assistant {
    margin-right: auto;
    background: #181c23;
    border: 1px solid #282e38;
    border-bottom-left-radius: 5px;
}

/* =========================
   COMPOSER
========================= */

.composer {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid #242830;
    background: #101318;
}

.input {
    flex: 1;
    min-height: 48px;
    max-height: 130px;
    resize: none;
    border: 1px solid #303641;
    outline: none;
    border-radius: 16px;
    background: #181c23;
    color: #fff;
    padding: 13px 14px;
    font: inherit;
}

.input:focus {
    border-color: #505967;
}

.input::placeholder {
    color: #747c87;
}

.composer-button {
    width: 48px;
    height: 48px;
    flex: 0 0 48px;
    border: 0;
    border-radius: 50%;
    background: #e9edf2;
    color: #101318;
    font-size: 21px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    transition:
        transform .15s ease,
        background .15s ease;
}

.composer-button:active {
    transform: scale(.92);
}

.composer-button:disabled {
    opacity: .55;
}

.composer-button.stop-mode {
    background: #e45c5c;
    color: white;
}

/* =========================
   SCROLLBAR
========================= */

.chat::-webkit-scrollbar {
    width: 5px;
}

.chat::-webkit-scrollbar-thumb {
    background: #343a44;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <h1>Sushree</h1>
        <p>Your personal AI assistant</p>
    </header>

    <section class="character-area">
        <div id="character" class="character">
            🌸
        </div>
    </section>

    <div id="statusText" class="status">
        Ready to listen
    </div>

    <main id="chat" class="chat"></main>

    <div class="composer">

        <textarea
            id="input"
            class="input"
            rows="1"
            placeholder="Message Sushree..."
            autocomplete="off"
            spellcheck="true"></textarea>

        <button
            id="composerButton"
            class="composer-button"
            type="button"
            aria-label="Speak">
            🎙️
        </button>

    </div>

</div>

<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const WORKER_URL =
    "https://spring-cake-3e86.janisuresh661.workers.dev/";


/* =========================================================
   DOM
========================================================= */

const input =
    document.getElementById("input");

const button =
    document.getElementById("composerButton");

const statusText =
    document.getElementById("statusText");

const character =
    document.getElementById("character");

const chat =
    document.getElementById("chat");


/* =========================================================
   STATE
========================================================= */

let recognition = null;
let currentAudio = null;
let currentAudioURL = null;

let isListening = false;
let isSpeaking = false;
let isProcessing = false;

let requestController = null;


/* =========================================================
   UTILITY
========================================================= */

function setStatus(text) {
    statusText.textContent = text;
}


function setCharacter(mode) {

    character.classList.remove(
        "thinking",
        "listening",
        "speaking"
    );

    if (mode) {
        character.classList.add(mode);
    }
}


function addMessage(text, type) {

    const message = document.createElement("div");

    message.className =
        `message ${type}`;

    message.textContent = text;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

    return message;
}


function updateComposerButton() {

    /*
     * IMPORTANT:
     * Do not blindly change the button while audio
     * or recognition is active.
     */

    if (isListening || isSpeaking || isProcessing) {

        button.textContent = "■";

        button.classList.add("stop-mode");

        button.setAttribute(
            "aria-label",
            "Stop"
        );

        return;
    }

    button.classList.remove("stop-mode");

    if (input.value.trim()) {

        button.textContent = "➤";

        button.setAttribute(
            "aria-label",
            "Send"
        );

    } else {

        button.textContent = "🎙️";

        button.setAttribute(
            "aria-label",
            "Speak"
        );
    }
}


/* =========================================================
   INPUT
========================================================= */

input.addEventListener(
    "input",
    updateComposerButton
);


input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendText();
        }
    }
);


/* =========================================================
   STOP EVERYTHING
========================================================= */

function stopEverything() {

    /* Stop speech recognition */

    if (recognition) {

        try {
            recognition.stop();
        } catch (error) {
            console.log(
                "Recognition stop:",
                error
            );
        }
    }

    recognition = null;

    isListening = false;


    /* Stop current audio */

    if (currentAudio) {

        try {
            currentAudio.pause();

            currentAudio.currentTime = 0;

        } catch (error) {
            console.log(
                "Audio stop:",
                error
            );
        }
    }

    currentAudio = null;

    isSpeaking = false;


    /* Cancel active Worker request */

    if (requestController) {

        try {
            requestController.abort();
        } catch (error) {
            console.log(error);
        }
    }

    requestController = null;

    isProcessing = false;


    /* Remove temporary audio URL */

    if (currentAudioURL) {

        try {
            URL.revokeObjectURL(
                currentAudioURL
            );
        } catch (error) {
            console.log(error);
        }
    }

    currentAudioURL = null;


    setCharacter(null);

    setStatus("Ready to listen");

    updateComposerButton();
}


/* =========================================================
   COMPOSER ACTION
========================================================= */

function composerAction() {

    /*
     * If anything is active,
     * the button is ALWAYS STOP.
     */

    if (
        isListening ||
        isSpeaking ||
        isProcessing
    ) {

        stopEverything();

        return;
    }


    /*
     * If there is text,
     * send it.
     */

    if (input.value.trim()) {

        sendText();

        return;
    }


    /*
     * Otherwise start microphone.
     */

    listen();
}


/* =========================================================
   BUTTON
========================================================= */

button.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        composerAction();
    }
);


/* =========================================================
   SEND TEXT
========================================================= */

async function sendText() {

    const text =
        input.value.trim();

    if (!text) {
        return;
    }


    /* Prevent duplicate requests */

    if (
        isProcessing ||
        isListening ||
        isSpeaking
    ) {
        return;
    }


    addMessage(
        text,
        "user"
    );


    input.value = "";

    updateComposerButton();


    isProcessing = true;

    setCharacter("thinking");

    setStatus(
        "🌸 Sushree is thinking..."
    );

    updateComposerButton();


    requestController =
        new AbortController();


    try {

        const response =
            await fetch(
                WORKER_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    }),

                    signal:
                        requestController.signal
                }
            );


        const raw =
            await response.text();


        let data;

        try {

            data = JSON.parse(raw);

        } catch (error) {

            console.error(
                "Invalid Worker JSON:",
                raw
            );

            throw new Error(
                "The Worker returned an invalid response."
            );
        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                `Worker error (${response.status})`
            );
        }


        /*
         * Accept several common response names.
         * This makes the frontend less fragile.
         */

        const reply =
            data.reply ??
            data.response ??
            data.message ??
            data.text ??
            data.answer;


        if (
            typeof reply !== "string" ||
            !reply.trim()
        ) {

            throw new Error(
                "No reply was returned by the Worker."
            );
        }


        addMessage(
            reply,
            "assistant"
        );


        /*
         * Speak the response.
         */

        isProcessing = false;

        requestController = null;

        updateComposerButton();

        await speak(reply);


    } catch (error) {

        if (
            error.name ===
            "AbortError"
        ) {
            return;
        }


        console.error(
            "Message error:",
            error
        );


        addMessage(
            "⚠️ " +
            (
                error.message ||
                "Something went wrong."
            ),
            "assistant"
        );


        isProcessing = false;

        requestController = null;

        setCharacter(null);

        setStatus(
            "⚠️ Something went wrong"
        );

        updateComposerButton();
    }
}


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

function listen() {

    if (
        isListening ||
        isSpeaking ||
        isProcessing
    ) {
        return;
    }


    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        setStatus(
            "⚠️ Speech recognition isn't supported."
        );

        return;
    }


    /*
     * Make sure an old recognition instance
     * cannot interfere.
     */

    if (recognition) {

        try {
            recognition.stop();
        } catch (error) {}

        recognition = null;
    }


    recognition =
        new SpeechRecognition();


    recognition.continuous = false;

    recognition.interimResults = true;

    recognition.lang = "en-IN";


    let finalText = "";


    recognition.onstart =
        function() {

            isListening = true;

            setCharacter("listening");

            setStatus(
                "🎙️ Listening..."
            );

            updateComposerButton();
        };


    recognition.onresult =
        function(event) {

            let transcript = "";

            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                transcript +=
                    event.results[i][0].transcript;
            }


            input.value =
                transcript;


            if (
                event.results[
                    event.results.length - 1
                ].isFinal
            ) {

                finalText =
                    transcript.trim();
            }


            updateComposerButton();
        };


    recognition.onerror =
        function(event) {

            console.error(
                "Speech recognition error:",
                event
            );


            isListening = false;

            recognition = null;

            setCharacter(null);


            if (
                event.error ===
                "not-allowed"
            ) {

                setStatus(
                    "⚠️ Microphone permission denied."
                );

            } else if (
                event.error ===
                "no-speech"
            ) {

                setStatus(
                    "No speech detected."
                );

            } else {

                setStatus(
                    "⚠️ Microphone error."
                );
            }


            updateComposerButton();
        };


    recognition.onend =
        function() {

            isListening = false;

            recognition = null;

            setCharacter(null);


            const text =
                (
                    finalText ||
                    input.value
                ).trim();


            updateComposerButton();


            /*
             * Automatically send recognized speech.
             */

            if (text) {

                input.value = text;

                updateComposerButton();

                sendText();

            } else {

                setStatus(
                    "Ready to listen"
                );
            }
        };


    try {

        recognition.start();

    } catch (error) {

        console.error(
            "Recognition start failed:",
            error
        );

        recognition = null;

        isListening = false;

        setCharacter(null);

        setStatus(
            "⚠️ Could not start microphone."
        );

        updateComposerButton();
    }
}


/* =========================================================
   TEXT CLEANING FOR TTS
========================================================= */

function cleanTextForTTS(text) {

    let cleanText =
        String(text);


    /*
     * Remove emoji / pictographic characters.
     */

    try {

        cleanText =
            cleanText.replace(
                /\p{Emoji_Presentation}|\p{Extended_Pictographic}/gu,
                ""
            );

    } catch (error) {

        /*
         * Older browser fallback.
         */

        cleanText =
            cleanText.replace(
                /[\u{1F300}-\u{1FAFF}]/gu,
                ""
            );
    }


    cleanText =
        cleanText
            .replace(/\s+/g, " ")
            .trim();


    return cleanText;
}


/* =========================================================
   TTS
========================================================= */

async function speak(text) {

    const cleanText =
        cleanTextForTTS(text);


    if (!cleanText) {

        setStatus(
            "Ready to listen"
        );

        return;
    }


    /*
     * Stop previous audio.
     */

    if (currentAudio) {

        try {
            currentAudio.pause();

            currentAudio.currentTime = 0;

        } catch (error) {}
    }


    if (currentAudioURL) {

        try {
            URL.revokeObjectURL(
                currentAudioURL
            );
        } catch (error) {}

        currentAudioURL = null;
    }


    isSpeaking = true;

    setCharacter("speaking");

    setStatus(
        "🔊 Sushree is preparing to speak..."
    );

    updateComposerButton();


    try {

        const response =
            await fetch(
                WORKER_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        action: "tts",

                        message:
                            cleanText,

                        voice:
                            "Zephyr"
                    })
                }
            );


        const raw =
            await response.text();


        let data;

        try {

            data =
                JSON.parse(raw);

        } catch (error) {

            console.error(
                "Invalid TTS JSON:",
                raw
            );

            throw new Error(
                "TTS returned an invalid response."
            );
        }


        console.log(
            "TTS response:",
            data
        );


        if (
            !response.ok ||
            data.success === false
        ) {

            throw new Error(
  "TTS returned an invalid response."
);
}

console.log(
  "TTS response:",
  data
);

if (
  !response.ok ||
  data.success === false
) {

  throw new Error(
    data.error ||
    `TTS failed with HTTP ${response.status}`
  );
}

if (!data.audio) {

  throw new Error(
    "No audio was returned by the Worker."
  );
}


/* =========================================
   CONVERT WORKER PCM BASE64
   INTO PLAYABLE WAV
   ========================================= */

const wavBlob =
  base64ToWav(
    data.audio,
    24000
  );


/* =========================================
   CREATE AUDIO URL
   ========================================= */

currentAudioURL =
  URL.createObjectURL(
    wavBlob
  );


/* =========================================
   CREATE AUDIO
   ========================================= */

const audio =
  new Audio();

audio.preload = "auto";

audio.src =
  currentAudioURL;

currentAudio =
  audio;


/* =========================================
   AUDIO START
   ========================================= */

audio.onplay = () => {

  statusText.textContent =
    "🔊 Speaking...";

  updateComposerButton();
};


/* =========================================
   AUDIO ENDED
   ========================================= */

audio.onended = () => {

  if (currentAudio === audio) {
    currentAudio = null;
  }

  if (currentAudioURL) {

    URL.revokeObjectURL(
      currentAudioURL
    );

    currentAudioURL = null;
  }

  updateComposerButton();

  statusText.textContent =
    "Ready";
};


/* =========================================
   AUDIO ERROR
   ========================================= */

audio.onerror = (event) => {

  console.error(
    "Audio playback error:",
    event
  );

  if (currentAudio === audio) {
    currentAudio = null;
  }

  if (currentAudioURL) {

    URL.revokeObjectURL(
      currentAudioURL
    );

    currentAudioURL = null;
  }

  updateComposerButton();

  statusText.textContent =
    "⚠️ Audio playback failed.";
};


/* =========================================
   PLAY AUDIO
   ========================================= */

try {

  await audio.play();

} catch (error) {

  console.error(
    "Audio play failed:",
    error
  );

  if (currentAudio === audio) {
    currentAudio = null;
  }

  if (currentAudioURL) {

    URL.revokeObjectURL(
      currentAudioURL
    );

    currentAudioURL = null;
  }

  updateComposerButton();

  statusText.textContent =
    "⚠️ Could not play audio.";
}


/* =========================================
   PROCESS MESSAGE ERROR
   ========================================= */

} catch (error) {

  console.error(
    "processMessage error:",
    error
  );

  if (currentAudio) {

    try {
      currentAudio.pause();
    } catch (e) {
      console.log(
        "Audio cleanup failed:",
        e
      );
    }

    currentAudio = null;
  }

  if (currentAudioURL) {

    URL.revokeObjectURL(
      currentAudioURL
    );

    currentAudioURL = null;
  }

  updateComposerButton();

  statusText.textContent =
    "⚠️ " +
    (
      error.message ||
      "Something went wrong."
    );
}


/* =========================================
   STOP EVERYTHING
   ========================================= */

function stopEverything() {

  /* Stop speech recognition */

  if (recognition) {

    try {

      recognition.onend = null;
      recognition.stop();

    } catch (error) {

      console.log(
        "Recognition already stopped."
      );
    }

    recognition = null;
  }


  /* Stop audio */

  if (currentAudio) {

    try {

      currentAudio.pause();
      currentAudio.currentTime = 0;

    } catch (error) {

      console.log(
        "Audio already stopped."
      );
    }

    currentAudio = null;
  }


  /* Release audio URL */

  if (currentAudioURL) {

    URL.revokeObjectURL(
      currentAudioURL
    );

    currentAudioURL = null;
  }


  updateComposerButton();

  statusText.textContent =
    "Ready";
}


/* =========================================
   MAIN COMPOSER ACTION
   ========================================= */

function composerAction() {

  if (
    recognition ||
    currentAudio
  ) {

    stopEverything();

    return;
  }


  if (
    input.value.trim()
  ) {

    sendText();

    return;
  }


  listen();
}


/* =========================================
   ENTER KEY
   ========================================= */

input.addEventListener(
  "keydown",
  function (event) {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      sendText();
    }
  }
);


/* =========================================
   SPEECH RECOGNITION
   ========================================= */

function listen() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    statusText.textContent =
      "⚠️ Speech recognition isn't supported.";

    return;
  }


  /* Stop old recognition */

  if (recognition) {

    try {

      recognition.onend = null;
      recognition.stop();

    } catch (error) {

      console.log(
        "Old recognition already stopped."
      );
    }

    recognition = null;
  }


  const rec =
    new SpeechRecognition();

  recognition =
    rec;


  rec.continuous =
    false;

  rec.interimResults =
    true;

  rec.lang =
    "en-IN";


  /* =======================================
     RECOGNITION START
     ======================================= */

  rec.onstart = () => {

    statusText.textContent =
      "🎙️ Listening...";

    updateComposerButton();
  };


  /* =======================================
     RECOGNITION RESULT
     ======================================= */

  rec.onresult = (event) => {

    let transcript = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      transcript +=
        event.results[i][0].transcript;
    }

    input.value =
      transcript;

    updateComposerButton();
  };


  /* =======================================
     RECOGNITION ERROR
     ======================================= */

  rec.onerror = (event) => {

    console.error(
      "Speech recognition error:",
      event.error
    );

    recognition = null;

    updateComposerButton();


    if (
      event.error ===
      "not-allowed"
    ) {

      statusText.textContent =
        "⚠️ Microphone permission denied.";

      return;
    }


    if (
      event.error ===
      "no-speech"
    ) {

      statusText.textContent =
        "⚠️ No speech detected.";

      return;
    }


    statusText.textContent =
      "⚠️ Speech recognition failed.";
  };


  /* =======================================
     RECOGNITION END
     ======================================= */

  rec.onend = () => {

    recognition = null;

    updateComposerButton();


    const text =
      input.value.trim();


    if (!text) {

      statusText.textContent =
        "Ready";

      return;
    }


    processMessage(
      text
    );
  };


  /* =======================================
     START MICROPHONE
     ======================================= */

  try {

    rec.start();

  } catch (error) {

    console.error(
      "Could not start microphone:",
      error
    );

    recognition = null;

    updateComposerButton();

    statusText.textContent =
      "⚠️ Could not start microphone.";
  }
}


/* =========================================
   COMPOSER BUTTON
   ========================================= */

if (button) {

  button.addEventListener(
    "click",
    composerAction
  );
}


/* =========================================
   INITIAL BUTTON STATE
   ========================================= */

updateComposerButton();

/* =========================================================
   CLEANUP
   ========================================================= */

window.addEventListener(
  "pagehide",
  function() {

    stopEverything();

  }
);

</script>

</body>
</html>
