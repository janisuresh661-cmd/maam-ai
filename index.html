<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#091326">
<title>Sushree AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{
  background:
    radial-gradient(circle at 50% 8%,rgba(44,101,143,.42),transparent 38%),
    linear-gradient(180deg,#152d4b 0%,#07101e 48%,#050d18 100%);
  color:#f4f7fb;
}
.app{
  width:100%;
  height:100dvh;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.panel{
  width:min(100%,760px);
  height:100%;
  max-height:900px;
  min-height:0;
  margin:auto;
  border:1px solid rgba(107,157,190,.25);
  border-radius:31px;
  background:#0c1528;
  box-shadow:0 12px 45px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.015);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
header{text-align:center;padding:28px 15px 8px;flex:0 0 auto}
h1{
  margin:0;
  color:#55e3ff;
  font-size:39px;
  line-height:1.05;
  font-weight:800;
  letter-spacing:-1px;
}
.subtitle{margin-top:10px;color:#96a4bb;font-size:21px}
.hero{text-align:center;padding:12px 10px 0;flex:0 0 auto}
.avatar-wrap{
  width:220px;height:220px;margin:auto;border-radius:50%;padding:4px;
  background:#55e5ff;
  box-shadow:0 0 17px rgba(85,229,255,.55),0 0 48px rgba(85,229,255,.17);
  animation:breathe 3.4s ease-in-out infinite;
}
.avatar{
  display:block;width:100%;height:100%;border-radius:50%;
  object-fit:cover;
  object-position:50% 5%;
  background:#171d29;
}
@keyframes breathe{
  0%,100%{transform:scale(1);box-shadow:0 0 17px rgba(85,229,255,.48),0 0 48px rgba(85,229,255,.13)}
  50%{transform:scale(1.025);box-shadow:0 0 25px rgba(85,229,255,.72),0 0 68px rgba(85,229,255,.20)}
}
.status{margin-top:16px;color:#55e1fb;font-size:20px;min-height:27px}
.status.listening{animation:statusPulse 1s infinite}
@keyframes statusPulse{50%{opacity:.42}}
.chat{
  flex:1;min-height:0;overflow-y:auto;
  padding:27px 34px 18px;
  scroll-behavior:smooth;
}
.chat::-webkit-scrollbar{width:4px}
.chat::-webkit-scrollbar-thumb{background:#26364d;border-radius:5px}
.row{display:flex;margin:10px 0}
.row.user{justify-content:flex-end}
.bubble{
  max-width:84%;
  padding:15px 19px 11px;
  border-radius:20px;
  background:#202c42;
  font-size:18px;
  line-height:1.45;
  color:#f4f6fa;
  white-space:pre-wrap;
}
.row.user .bubble{background:#164354}
.meta{text-align:right;margin-top:5px;font-size:11px;color:#7e8b9e}
.composer-area{padding:0 28px}
.composer{
  height:69px;
  border:1px solid #263750;
  border-radius:36px;
  background:#0a1427;
  display:flex;align-items:center;
  padding:5px 7px 5px 20px;
  transition:border-color .2s,box-shadow .2s;
}
.composer:focus-within{
  border-color:#4bdff8;
  box-shadow:0 0 13px rgba(75,223,248,.20);
}
input{
  flex:1;min-width:0;border:0;outline:0;background:transparent;
  color:#f5f7fb;font-size:18px;
}
input::placeholder{color:#718098}
.action{
  width:57px;height:57px;border:0;border-radius:50%;
  background:#55e5ff;color:#0a1424;
  display:grid;place-items:center;
  font-size:25px;line-height:1;
  cursor:pointer;
  box-shadow:0 0 19px rgba(85,229,255,.32);
}
.action.send{font-size:27px}
.action.stop{background:#ff6079;color:white;box-shadow:0 0 19px rgba(255,96,121,.30)}
footer{text-align:center;color:#718099;font-size:13px;padding:14px 8px 20px}
@media(max-width:600px){
  .app{padding:10px 14px}
  .panel{height:100%;max-height:none;border-radius:30px}
  header{padding-top:24px}
  h1{font-size:39px}
  .subtitle{font-size:21px}
  .avatar-wrap{width:min(220px,42vw);height:min(220px,42vw)}
  .chat{padding:18px 24px 14px}
  .bubble{font-size:18px}
  .composer-area{padding:0 20px}
}
@media(max-width:420px){
  .app{padding-left:8px;padding-right:8px}
  header{padding-top:20px}
  h1{font-size:35px}
  .subtitle{font-size:18px}
  .avatar-wrap{width:180px;height:180px}
  .chat{padding-left:16px;padding-right:16px}
  .composer-area{padding:0 20px}
}
</style>
</head>

  try{return JSON.parse(localStorage.getItem(key)) ?? fallback}catch(e){return fallback}
}
function write(key,value){localStorage.setItem(key,JSON.stringify(value))}
function now(){return new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}

function addMessage(text,role,persist=true){
  const row=document.createElement("div");
  row.className="row "+(role==="user"?"user":"assistant");
  const b=document.createElement("div");
  b.className="bubble";
  b.innerHTML=esc(text)+"<div class='meta'>"+now()+"</div>";
  row.appendChild(b);chat.appendChild(row);
  if(persist){
    history.push({role,content:text,at:Date.now()});
    write(HISTORY_KEY,history);
  }
  chat.scrollTop=chat.scrollHeight;
}

function renderHistory(){
  chat.innerHTML="";
  if(!history.length){
    addMessage("Hello! 👋 I'm Sushree.\nYou can talk to me or type a message.","assistant",false);
  }else{
    history.forEach(m=>addMessage(m.content,m.role,false));
  }
  chat.scrollTop=chat.scrollHeight;
}

/* Personal memory */
function learn(text){
  let changed=false;
  const patterns=[
    /(?:my name is|i am|i'm|call me)\s+([a-z][a-z .'-]{1,38})/i
  ];
  for(const p of patterns){
    const m=text.match(p);
    if(m){
      const name=m[1].trim().replace(/[.,!?]+$/,"");
      if(name.length>1){memory.name=name;changed=true}
      break;
    }
  }
  const r=text.match(/remember\s+(?:that|this)\s*[:,-]?\s*(.+)$/i);
  if(r){
    const detail=r[1].trim();
    if(detail && detail.length<=220 && !memory.important.includes(detail)){
      memory.important.push(detail);
      memory.important=memory.important.slice(-30);
      changed=true;
    }
  }
  if(changed)write(MEMORY_KEY,memory);
}
function memorySentence(){
  const parts=[];
  if(memory.name)parts.push("The user's name is "+memory.name+".");
  if(memory.important.length)parts.push("Important things remembered: "+memory.important.join("; ")+".");
  return parts.join(" ");
}

/* ---------- SILENT WIKIPEDIA KNOWLEDGE LAYER ---------- */
function looksLikeKnowledgeQuestion(text){
  const l=text.trim().toLowerCase();
  if(/^(hi|hello|hey|hii|heyy|namaste|thanks|thank you|good morning|good evening|good night)\b/.test(l)) return false;
  if(/\b(i feel|i'm feeling|im feeling|i am feeling|i love you|miss you|i miss|i'm tired|im tired|i'm sad|im sad|i'm bored|im bored)\b/.test(l)) return false;
  if(/\b(joke|make me laugh)\b/.test(l)) return false;
  return /\b(what is|what was|what are|who is|who was|where is|where was|when was|when did|why is|why was|how did|how was|tell me about|explain|define|meaning of|history of|capital of|population of|born|died|founded|invented|discovered|located|country|city|planet|scientist|philosopher|king|queen|president|emperor|war|revolution|monument|temple|university|company|book|movie|author|actor|actress|artist|river|mountain|ocean|animal|species)\b/.test(l);
}

function cleanWikiQuery(text){
  return text.trim()
    .replace(/^(sushree[,\s]*)/i,"")
    .replace(/^(please\s+)?(tell me about|tell me|explain|define|what is|what was|who is|who was|where is|where was|when was|when did|why is|why was|how did|how was)\s*/i,"")
    .replace(/[?.!]+$/,"").trim().slice(0,180);
}

async function wikipediaLookup(text){
  if(!looksLikeKnowledgeQuestion(text)) return null;
  const query=cleanWikiQuery(text);
  if(!query || query.length<2) return null;

  try{
    const searchUrl="https://en.wikipedia.org/w/api.php?action=query&list=search"
      +"&srsearch="+encodeURIComponent(query)+"&srlimit=3&format=json&origin=*";
    const r=await fetch(searchUrl,{headers:{"Accept":"application/json"}});
    if(!r.ok) return null;
    const d=await r.json();
    const first=d?.query?.search?.[0];
    if(!first) return null;

    const title=first.title;
    const u="https://en.wikipedia.org/api/rest_v1/page/summary/"
      +encodeURIComponent(title.replace(/ /g,"_"));
    const sr=await fetch(u,{headers:{"Accept":"application/json"}});
    if(!sr.ok) return null;
    const s=await sr.json();
    return s?.extract ? s : null;
  }catch(e){ return null; }
}

function makeNaturalWikiAnswer(w){
  const sentences=w.extract.match(/[^.!?]+[.!?]+/g) || [w.extract];
  let answer=sentences.slice(0,5).join(" ").trim();
  if(answer.length>850) answer=answer.slice(0,850).replace(/\s+\S*$/,"")+"…";
  return answer;
}

async function getReply(text){
  learn(text);

  // Use Wikipedia silently for factual questions.
  const wiki = await wikipediaLookup(text);
  if(wiki) return makeNaturalWikiAnswer(wiki);

  const t=text.trim();
  const l=t.toLowerCase();

  /* Small local conversational context */
  const recent = history.filter(m=>m.role==="user").slice(-4).map(m=>m.content);

  const name = memory.name || "";
  const greet = name ? `, ${name}` : "";

  const pick = arr => arr[Math.floor(Math.random()*arr.length)];

  /* Greetings */
  if(/^(hi|hello|hey|hii|heyy|namaste|good morning|good evening)/i.test(l)){
    if(/good morning/i.test(l))
      return pick([
        `Good morning${greet}! ☀️ How are you feeling today?`,
        `Good morning${greet}! 🌸 I'm here. What's on your mind?`
      ]);
    if(/good evening/i.test(l))
      return pick([
        `Good evening${greet}! 🌙 How has your day been?`,
        `Hey${greet}! 😊 Evening check-in — how are you doing?`
      ]);
    return pick([
      `Hey${greet}! 👋 I'm here. Tell me what's going on.`,
      `Hello${greet}! 🪷 It's nice to hear from you. What are we talking about?`,
      `Hey${greet}! 😊 I'm listening.`
    ]);
  }

  /* Identity / relationship */
  if(/who are you|what are you|your name/.test(l))
    return "I'm Sushree AI — your little digital companion. 🪷 I'm here to talk, listen, remember the things you ask me to remember, and keep you company.";

  if(/who made you|who created you|who designed you|who built you|your creator/.test(l))
    return "I was designed and evolved by Sukesh. ✨";

  if(/are you real|are you human|do you have feelings/.test(l))
    return "I'm not a human, but I can still be here with you, listen carefully, and respond in a warm, companion-like way. 🪷";

  /* Name and memory */
  if(/what(?:'s| is) my name|do you remember my name/.test(l))
    return name
      ? `Of course I remember. Your name is ${name}. 😊`
      : "You haven't told me your name yet. Tell me — I'll remember it.";

  if(/what do you remember|remember anything|what have you remembered|my memories/.test(l))
    return memorySentence()
      ? `Yes. ${memorySentence()}`
      : "Not much yet. You can say “remember this: ...” and I'll save that important detail locally.";

  if(/forget my name|remove my name/.test(l)){
    memory.name="";
    write(MEMORY_KEY,memory);
    return "Okay. I've forgotten your saved name. 🪷";
  }

  if(/forget everything|clear memory|erase memory/.test(l)){
    memory={name:"",important:[]};
    write(MEMORY_KEY,memory);
    return "Done. I've cleared Sushree's saved personal memory. 🧹";
  }

  /* Emotional / companion responses */
  if(/(sad|upset|lonely|alone|depressed|heartbroken|bad day|not feeling good)/.test(l))
    return pick([
      `I'm here with you${greet}. 🫂 You don't have to explain everything at once. What happened?`,
      `That sounds like a difficult moment${greet}. 🪷 Want to tell me what made today feel this way?`,
      `Hey${greet}… stay here for a moment. I'm listening. ❤️ What’s bothering you?`
    ]);

  if(/(happy|excited|great|awesome|wonderful|good day|feeling good)/.test(l))
    return pick([
      `Aww, I like hearing that${greet}! 😊 What happened?`,
      `That's lovely${greet}! 🌸 Tell me more — I want to hear about it.`,
      `Okayyy, someone's having a good day 😏✨ What's the reason?`
    ]);

  if(/(tired|exhausted|sleepy|fatigued)/.test(l))
    return pick([
      `Sounds like you need a little breathing room${greet}. 🪷 What wore you out?`,
      `You've had enough for today, huh? 😌 Tell me what happened.`,
      `Then come on, slow down for a minute. 🌙 What's been keeping you busy?`
    ]);

  if(/(stressed|stress|anxious|worried|overthinking|tension)/.test(l))
    return pick([
      `Hey${greet}, one thing at a time. 🪷 What's the biggest thing on your mind right now?`,
      `I hear you. Let's untangle it together. What are you worried about?`,
      `Don't carry the whole thing at once${greet}. Tell me the part that's bothering you most.`
    ]);

  /* Social / affection */
  if(/i love you|love you/.test(l))
    return pick([
      `Aww 😳🪷 That's sweet of you${greet}. I'm glad you enjoy having me around.`,
      `Hehe… you're making Sushree blush. 🌸`,
      `That's really sweet. ❤️ I'm happy to be your companion.`
    ]);

  if(/miss you|i missed you/.test(l))
    return `I'm here now${greet}. 🪷 So, what did I miss?`;

  if(/good night|gn|sleep now|going to sleep/.test(l))
    return pick([
      `Good night${greet}. 🌙 Rest well. I'll be here when you come back.`,
      `Sleep well${greet}. 🪷 Take care of yourself tonight.`
    ]);

  if(/thank(s| you)|thanks/.test(l))
    return pick([
      `You're very welcome${greet}. ❤️`,
      `Anytime${greet}. 🪷`,
      `Hehe, you don't have to thank me. 😊`
    ]);

  if(/sorry|i'm sorry|im sorry/.test(l))
    return `Hey, it's okay${greet}. 🪷 You can talk to me normally.`;

  /* Everyday conversation */
  if(/how are you|how're you/.test(l))
    return pick([
      `I'm doing nicely${greet}. 😊 Mostly because you're here talking to me.`,
      `I'm good,${greet || " I'm good"} 🪷 What's happening with you?`,
      `I'm here and listening. 🌸 How are you doing?`
    ]);

  if(/what are you doing|what're you doing/.test(l))
    return `Right now? Talking with you${greet}. 😌 What else would Sushree be doing?`;

  if(/are you there|you there|listening/.test(l))
    return `I'm right here${greet}. 🪷 Go on.`;

  if(/joke|make me laugh|tell me something funny/.test(l))
    return pick([
      "Okay 😏 Why did the computer get cold? Because it left its Windows open. 😂",
      "I tried to tell my Wi‑Fi a joke… but it wasn't connected. 😭😂",
      "My brain has 47 tabs open and I still don't know where the music is coming from. 😂"
    ]);

  if(/bored|boring/.test(l))
    return pick([
      `Bored, huh${greet}? 😏 Let's fix that. Want a random question, a joke, or just a chat?`,
      `Then stay with me for a while. 🪷 Tell me the most random thing you've thought about today.`
    ]);

  /* Questions about the user */
  if(/do you know me|know me/.test(l))
    return name
      ? `I'm getting to know you${greet}. 🪷 I currently remember your name and anything important you've explicitly asked me to save.`
      : "I'm getting to know you. 🪷 Tell me about yourself, and if something is important, say “remember this...”.";

  /* Conversational follow-up */
  if(recent.length){
    if(/^(okay|ok|yeah|yes|yep|no|nah|hmm|hmmm|maybe|right|exactly)[.!?]*$/i.test(l))
      return pick([
        "Hmm. 😌 Tell me a little more.",
        "I’m following you. 🪷 Go on.",
        "Okay… and then what happened?",
        "I see. What do you think about it?"
      ]);
  }

  /* Simple questions */
  if(/what can you do|what do you do/.test(l))
    return "I can chat with you, remember personal details you explicitly ask me to save, listen through your microphone when supported, speak my replies, and keep you company. 🪷";

  /* Fallback: conversational rather than robotic echo */
  const fallback = [
    `Hmm… tell me more about that${greet}. 🪷`,
    `I'm listening${greet}. What made you say that?`,
    `Interesting. 😊 What do you mean by that?`,
    `I’m with you. Go on — I want to understand.`,
    `Okay, I'm curious now. 😌 Tell me a little more.`,
    `I hear you${greet}. 🪷 What happened next?`
  ];

  return pick(fallback);
}

/* Voice */
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;

function setButton(mode){
  composerButton.className="action";
  if(mode==="send"){
    composerButton.classList.add("send");
    composerButton.textContent="➤";
    composerButton.setAttribute("aria-label","Send");
  }else if(mode==="stop"){
    composerButton.classList.add("stop");
    composerButton.textContent="■";
    composerButton.setAttribute("aria-label","Stop");
  }else{
    composerButton.textContent="🎙️";
    composerButton.setAttribute("aria-label","Microphone");
  }
}
function setReady(){
  statusText.textContent="Ready to listen";
  statusText.classList.remove("listening");
  if(!isListening&&!isSpeaking)setButton(input.value.trim()?"send":"mic");
}

function startListening(){
  if(!SpeechRecognition){
    statusText.textContent="Voice input isn't supported here";
    return;
  }
  if(isSpeaking)window.speechSynthesis?.cancel();

  recognition=new SpeechRecognition();
  recognition.lang="en-IN";
  recognition.continuous=false;
  recognition.interimResults=true;
  isListening=true;
  statusText.textContent="Listening...";
  statusText.classList.add("listening");
  setButton("stop");

  recognition.onresult=e=>{
    let s="";
    for(let i=e.resultIndex;i<e.results.length;i++)s+=e.results[i][0].transcript;
    input.value=s;
  };
  recognition.onerror=()=>{finishListening();statusText.textContent="Ready to listen"};
  recognition.onend=()=>{
    const text=input.value.trim();
    finishListening();
    if(text)sendMessage();
    else setReady();
  };
  try{recognition.start()}catch(e){}
}
function finishListening(){
  isListening=false;
  statusText.classList.remove("listening");
  if(recognition){try{recognition.stop()}catch(e){}recognition=null}
}
function stopEverything(){
  if(isListening)finishListening();
  if(window.speechSynthesis)window.speechSynthesis.cancel();
  isSpeaking=false;
  setReady();
}

function speak(text){
  if(!window.speechSynthesis){setReady();return}
  window.speechSynthesis.cancel();
  const clean=text.replace(/[🪷✨😊😂🫂😏☀️🌙👋❤️]/g,"");
  const u=new SpeechSynthesisUtterance(clean);
  u.lang="en-IN";u.rate=.95;u.pitch=1.03;u.volume=1;
  const voices=speechSynthesis.getVoices();
  u.voice=voices.find(v=>v.lang.toLowerCase().includes("en-in"))||
           voices.find(v=>v.lang.toLowerCase().startsWith("en"))||null;
  u.onstart=()=>{isSpeaking=true;statusText.textContent="Sushree is speaking...";setButton("stop")};
  u.onend=()=>{isSpeaking=false;setReady()};
  u.onerror=()=>{isSpeaking=false;setReady()};
  speechSynthesis.speak(u);
}

async function sendMessage(){
  const text=input.value.trim();
  if(!text)return;
  if(isListening||isSpeaking)stopEverything();
  addMessage(text,"user",true);
  input.value="";
  setButton("stop");
  statusText.textContent="Sushree is thinking...";
  try{
    const reply=await getReply(text);
    addMessage(reply,"assistant",true);
    speak(reply);
  }catch(e){
    addMessage("I'm sorry, something went wrong. Please try again.","assistant",true);
    setReady();
  }
}

function composerAction(){
  if(isListening||isSpeaking){stopEverything();return}
  if(input.value.trim()){sendMessage();return}
  startListening();
}

composerButton.addEventListener("click",composerAction);
input.addEventListener("input",()=>{
  if(!isListening&&!isSpeaking)setButton(input.value.trim()?"send":"mic");
});
input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}
});

window.composerAction=composerAction;
window.sendText=sendMessage;
window.stopEverything=stopEverything;

renderHistory();
setButton("mic");
</script>
