<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sushree AI</title>

  <style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(circle at 50% 0%, #243b64 0%, #080b14 55%);
  display: flex;
  justify-content: center;
  align-items: center;
}

.app {
  width: 94%;
  max-width: 520px;
  min-height: 92vh;
  padding: 22px;
  border-radius: 28px;
  background: rgba(15, 23, 42, 0.96);
  border: 1px solid #334155;
  box-shadow: 0 0 50px rgba(92, 232, 255, .12);
  display: flex;
  flex-direction: column;
}

.header {
  text-align: center;
}

.header h1 {
  margin: 5px 0;
  font-size: 32px;
  color: #5ce8ff;
}

.header p {
  margin: 5px 0 18px;
  color: #94a3b8;
}

.character {
  width: 170px;
  height: 170px;
  margin: 5px auto 15px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 80px;
  background: radial-gradient(circle, #334b78, #08111f);
  border: 3px solid #5ce8ff;
  box-shadow: 0 0 35px rgba(92, 232, 255, .35);
  transition: .3s;
    overflow: hidden;
}

.character img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
}

.character.listening {
  animation: listenPulse 1.2s infinite;
}

  .character.thinking {
  animation: thinkingPulse 1.5s infinite ease-in-out;
}

@keyframes thinkingPulse {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 0 35px rgba(92, 232, 255, .35);
  }

  50% {
    transform: scale(1.025);
    box-shadow: 0 0 48px rgba(167, 139, 250, .65);
  }
}
.character.speaking {
  animation: speakPulse .45s infinite alternate;
}

@keyframes listenPulse {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 0 35px rgba(92, 232, 255, .35);
  }

  50% {
    transform: scale(1.04);
    box-shadow: 0 0 60px rgba(92, 232, 255, .85);
  }
}

@keyframes speakPulse {
  from {
    transform: scale(1);
    box-shadow: 0 0 35px rgba(92, 232, 255, .35);
  }

  to {
    transform: scale(1.045);
    box-shadow: 0 0 55px rgba(92, 232, 255, .75);
  }
}

.status {
  text-align: center;
  min-height: 22px;
  color: #67e8f9;
  margin-bottom: 12px;
}

.chat {
  flex: 1;
  min-height: 220px;
  max-height: 340px;
  overflow-y: auto;
  padding: 5px;
}

.message {
  padding: 12px 15px;
  margin: 9px 0;
  border-radius: 16px;
  line-height: 1.5;
  max-width: 85%;
}

.sushree {
  background: #1e293b;
  margin-right: 35px;
}

.user {
  background: #164e63;
  margin-left: 35px;
  text-align: right;
}

/* Modern AI Composer */

.composer {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding: 6px 7px 6px 16px;
  border: 1px solid #334155;
  border-radius: 28px;
  background: #0f172a;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
  transition: border-color 0.25s ease, box-shadow 0.25s ease;
}

.composer:focus-within {
  border-color: #5ce8ff;
  box-shadow: 0 0 0 3px rgba(92, 232, 255, 0.08);
}

.composer input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  font-size: 15px;
  padding: 9px 0;
}

.composer input::placeholder {
  color: #64748b;
}

.composer-button {
  width: 42px;
  height: 42px;
  min-width: 42px;
  padding: 0;
  border: none;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #5ce8ff;
  color: #08111f;
  font-size: 18px;
  cursor: pointer;
  box-shadow: 0 2px 10px rgba(92, 232, 255, 0.25);
  transition: transform 0.2s ease,
              background 0.2s ease,
              box-shadow 0.2s ease;
}

.composer-button:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 16px rgba(92, 232, 255, 0.35);
}

.composer-button:active {
  transform: scale(0.92);
}

.composer-button.stop-mode {
  background: #475569;
  color: white;
  box-shadow: 0 2px 10px rgba(71, 85, 105, 0.35);
}

.footer {
  text-align: center;
  margin-top: 14px;
  color: #64748b;
  font-size: 11px;
}
/* Sushree feels alive */
.character {
  animation: naturalBreathing 4s ease-in-out infinite;
}

.character img {
  transition: transform 0.4s ease, filter 0.4s ease;
}

/* Gentle natural breathing */
@keyframes naturalBreathing {
  0%, 100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.015);
  }
}

/* Soft idle glow */
.character:not(.listening):not(.thinking):not(.speaking) {
  box-shadow: 0 0 35px rgba(92, 232, 255, 0.35);
}

/* Thinking state */
.character.thinking img {
  transform: scale(1.02);
  filter: brightness(1.05);
}

/* Speaking state */
.character.speaking img {
  transform: scale(1.025);
  filter: brightness(1.1);
}

/* Listening state */
.character.listening img {
  transform: scale(1.015);
  filter: brightness(1.08);
}
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>Sushree AI</h1>
    <p>Your interactive digital companion</p>
  </div>

  <div id="character" class="character">
    <img src="Sushree.png" alt="Sushree">
  </div>

  <div id="status" class="status">
    Ready to listen
  </div>

  <div id="chat" class="chat">

    <div class="message sushree">
      Hello! 👋 I'm Sushree.<br>
      You can talk to me or type a message.
    </div>

  </div>

<div class="composer">

  <input
    id="input"
    class="composer-input"
    type="text"
    placeholder="Talk to Sushree..."
  >

  <button
    id="composerButton"
    class="composer-button"
    onclick="composerAction()"
    aria-label="Speak"
  >
    🎙️
  </button>

</div>

<div class="footer">
  Sushree AI • Designed & Evolved by Sukesh ✨
</div>

</div>

<script>

/* =========================================================
   SUSHREE AI — COMPLETE SCRIPT
   ========================================================= */

/* ---------------------------
   ELEMENTS
--------------------------- */

const input = document.getElementById("input");
const chat = document.getElementById("chat");
const statusText = document.getElementById("status");
const character = document.getElementById("character");
const button = document.getElementById("composerButton");


/* ---------------------------
   CONFIGURATION
--------------------------- */

const WORKER_URL =
  "https://spring-cake-3e86.janisuresh661.workers.dev";


/* ---------------------------
   STATE
--------------------------- */

let recognition = null;
let currentAudio = null;
let history = [];


/* ---------------------------
   LOCAL MEMORY
--------------------------- */

let memory = {};

try {

  memory = JSON.parse(
    localStorage.getItem("sushreeMemory") || "{}"
  );

} catch (error) {

  console.error("Memory loading error:", error);

  memory = {};

}


function saveMemory() {

  try {

    localStorage.setItem(
      "sushreeMemory",
      JSON.stringify(memory)
    );

  } catch (error) {

    console.error("Memory saving error:", error);

  }

}


function remember(key, value) {

  memory[key] = value;

  saveMemory();

}


/* =========================================================
   CHAT MESSAGE
   ========================================================= */

function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type;

  /*
    Basic formatting:
    **bold**
    # heading
    ## heading
    ### heading
    line breaks
  */

  let formatted = String(text);

  formatted = formatted
    .replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    )
    .replace(
      /^### (.*)$/gm,
      "<h3>$1</h3>"
    )
    .replace(
      /^## (.*)$/gm,
      "<h2>$1</h2>"
    )
    .replace(
      /^# (.*)$/gm,
      "<h1>$1</h1>"
    )
    .replace(
      /\n/g,
      "<br>"
    );

  message.innerHTML = formatted;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}


/* =========================================================
   COMPOSER BUTTON
   ========================================================= */

function updateComposerButton() {

  if (!button) return;


  /*
    If microphone or audio is active,
    don't switch the button to Send.
  */

  if (recognition || currentAudio) {

    return;

  }


  if (input.value.trim()) {

    button.textContent = "➤";

    button.classList.remove("stop-mode");

    button.setAttribute(
      "aria-label",
      "Send"
    );

  } else {

    button.textContent = "🎙️";

    button.classList.remove("stop-mode");

    button.setAttribute(
      "aria-label",
      "Speak"
    );

  }

}


input.addEventListener(
  "input",
  updateComposerButton
);


/* =========================================================
   MAIN COMPOSER ACTION
   ========================================================= */

function composerAction() {

  /*
    If currently listening or speaking,
    button becomes STOP.
  */

  if (recognition || currentAudio) {

    stopEverything();

    return;

  }


  /*
    If user typed something,
    send it.
  */

  if (input.value.trim()) {

    sendText();

    return;

  }


  /*
    Otherwise start microphone.
  */

  listen();

}


/* =========================================================
   TEXT MESSAGE
   ========================================================= */

function sendText() {

  const text = input.value.trim();

  if (!text) {

    updateComposerButton();

    return;

  }

  input.value = "";

  updateComposerButton();

  addMessage(
    text,
    "user"
  );

  processMessage(text);

}


/* =========================================================
   ENTER KEY
   ========================================================= */

input.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      sendText();

    }

  }
);


/* =========================================================
   SPEECH RECOGNITION
   ========================================================= */

function listen() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    statusText.textContent =
      "⚠️ Speech recognition isn't supported.";

    return;

  }


  /*
    Make sure old recognition is gone.
  */

  if (recognition) {

    try {

      recognition.stop();

    } catch (error) {}

    recognition = null;

  }


  recognition =
    new SpeechRecognition();


  /*
    English India.

    We can later improve this for
    automatic multilingual recognition.
  */

  recognition.lang = "en-IN";

  recognition.continuous = false;

  recognition.interimResults = false;

  recognition.maxAlternatives = 1;


  /* ---------------------------
     START
  --------------------------- */

  recognition.onstart = function() {

    statusText.textContent =
      "🎙️ Listening...";

    character.classList.add(
      "listening"
    );

    button.textContent = "⏹";

    button.classList.add(
      "stop-mode"
    );

    button.setAttribute(
      "aria-label",
      "Stop"
    );

  };


  /* ---------------------------
     RESULT
  --------------------------- */

  recognition.onresult = function(event) {

    const result =
      event.results[0][0];

    const text =
      result.transcript.trim();


    character.classList.remove(
      "listening"
    );


    if (!text) {

      return;

    }


    input.value = "";

    addMessage(
      text,
      "user"
    );


    processMessage(text);

  };


  /* ---------------------------
     ERROR
  --------------------------- */

  recognition.onerror = function(event) {

    console.error(
      "Speech recognition error:",
      event.error
    );


    character.classList.remove(
      "listening"
    );


    recognition = null;


    /*
      Don't show an annoying error
      for normal microphone cancellation.
    */

    if (
      event.error === "aborted"
    ) {

      statusText.textContent =
        "Ready to listen";

    } else if (
      event.error === "not-allowed" ||
      event.error === "service-not-allowed"
    ) {

      statusText.textContent =
        "⚠️ Microphone permission denied.";

    } else if (
      event.error === "no-speech"
    ) {

      statusText.textContent =
        "I couldn't hear that. Try again.";

    } else {

      statusText.textContent =
        "⚠️ Voice input error.";

    }


    updateComposerButton();

  };


  /* ---------------------------
     END
  --------------------------- */

  recognition.onend = function() {

    character.classList.remove(
      "listening"
    );


    recognition = null;


    /*
      If Sushree isn't speaking,
      return button to normal.
    */

    if (!currentAudio) {

      statusText.textContent =
        "Ready to listen";

      updateComposerButton();

    }

  };


  /* ---------------------------
     START MICROPHONE
  --------------------------- */

  try {

    recognition.start();

  } catch (error) {

    console.error(
      "Could not start recognition:",
      error
    );

    recognition = null;

    character.classList.remove(
      "listening"
    );

    statusText.textContent =
      "⚠️ Couldn't start microphone.";

    updateComposerButton();

  }

}


/* =========================================================
   PROCESS MESSAGE
   ========================================================= */

async function processMessage(text) {

  statusText.textContent =
    "🧠 Thinking...";

  character.classList.add(
    "thinking"
  );


  /* ---------------------------
     REMEMBER USER'S NAME
  --------------------------- */

  const nameMatch = text.match(
    /\b(?:my name is|i am|i'm|call me)\s+([A-Za-z][A-Za-z\s'-]{0,30})/i
  );


  if (nameMatch) {

    const name =
      nameMatch[1].trim();

    remember(
      "name",
      name
    );

  }


  /* ---------------------------
     MEMORY CONTEXT
  --------------------------- */

  const memoryContext =
    Object.keys(memory).length

      ? `Known information about the user: ${JSON.stringify(memory)}`

      : "No saved information about the user yet.";


  try {

    /* ---------------------------
       CALL WORKER
    --------------------------- */

    const response =
      await fetch(
        WORKER_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            message:
              `${memoryContext}\n\nUser's message: ${text}`,

            history:
              history

          })

        }
      );


    /* ---------------------------
       READ RESPONSE
    --------------------------- */

    const raw =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(raw);

    } catch (error) {

      console.error(
        "Invalid JSON from Worker:",
        raw
      );

      throw new Error(
        "Worker returned an invalid response."
      );

    }


    console.log(
      "Worker response:",
      data
    );


    /* ---------------------------
       HTTP ERROR
    --------------------------- */

    if (!response.ok) {

      throw new Error(

        data.details

          ? JSON.stringify(
              data.details
            )

          : (
              data.error ||
              `Worker returned HTTP ${response.status}`
            )

      );

    }


    /* ---------------------------
       SUCCESS
    --------------------------- */

    if (
      data.success &&
      data.reply
    ) {

      /*
        Save conversation history.
      */

      history.push({

        role: "user",

        parts: [
          {
            text: text
          }
        ]

      });


      history.push({

        role: "model",

        parts: [
          {
            text: data.reply
          }
        ]

      });


      /*
        Prevent unlimited history growth.
      */

      if (history.length > 30) {

        history =
          history.slice(-30);

      }


      character.classList.remove(
        "thinking"
      );


      addMessage(
        data.reply,
        "sushree"
      );


      /*
        Speak the AI response.
      */

      speak(
        data.reply
      );


    } else {

      character.classList.remove(
        "thinking"
      );


      addMessage(

        data.error ||
        "Sorry, I couldn't get a response right now.",

        "sushree"

      );


      statusText.textContent =
        "Ready to listen";

    }

  } catch (error) {

    console.error(
      "Sushree API Error:",
      error
    );


    character.classList.remove(
      "thinking"
    );


    addMessage(

      `Sorry, something went wrong: ${error.message}`,

      "sushree"

    );


    statusText.textContent =
      "⚠️ Connection error";

  }

}


/* =========================================================
   GEMINI TTS — ZEPHYR
   ========================================================= */

/*
  Gemini returns raw PCM audio.

  We convert the PCM bytes into a WAV file
  so the browser can play it.
*/


function base64ToWav(
  base64,
  sampleRate = 24000
) {

  const binary =
    atob(base64);


  const pcm =
    new Uint8Array(
      binary.length
    );


  for (
    let i = 0;
    i < binary.length;
    i++
  ) {

    pcm[i] =
      binary.charCodeAt(i);

  }


  const dataLength =
    pcm.length;


  const buffer =
    new ArrayBuffer(
      44 + dataLength
    );


  const view =
    new DataView(buffer);


  function writeString(
    offset,
    string
  ) {

    for (
      let i = 0;
      i < string.length;
      i++
    ) {

      view.setUint8(
        offset + i,
        string.charCodeAt(i)
      );

    }

  }


  /* RIFF */

  writeString(
    0,
    "RIFF"
  );


  view.setUint32(
    4,
    36 + dataLength,
    true
  );


  writeString(
    8,
    "WAVE"
  );


  /* fmt */

  writeString(
    12,
    "fmt "
  );


  view.setUint32(
    16,
    16,
    true
  );


  /*
    PCM format
  */

  view.setUint16(
    20,
    1,
    true
  );


  /*
    Mono
  */

  view.setUint16(
    22,
    1,
    true
  );


  /*
    Sample rate
  */

  view.setUint32(
    24,
    sampleRate,
    true
  );


  /*
    Byte rate
    24000 × 1 × 16/8
  */

  view.setUint32(
    28,
    sampleRate * 2,
    true
  );


  /*
    Block align
  */

  view.setUint16(
    32,
    2,
    true
  );


  /*
    16-bit audio
  */

  view.setUint16(
    34,
    16,
    true
  );


  /* data */

  writeString(
    36,
    "data"
  );


  view.setUint32(
    40,
    dataLength,
    true
  );


  /*
    Copy PCM data.
  */

  new Uint8Array(
    buffer,
    44
  ).set(pcm);


  return new Blob(
    [buffer],
    {
      type: "audio/wav"
    }
  );

}


/* =========================================================
   SPEAK
   ========================================================= */

async function speak(text) {

  if (
    !text ||
    !text.trim()
  ) {

    return;

  }


  /*
    Stop old audio.
  */

  if (currentAudio) {

    try {

      currentAudio.pause();

      currentAudio.currentTime = 0;

    } catch (error) {}

    currentAudio = null;

  }


  /*
    Clean text for TTS.
  */

  let cleanText =
    String(text);


  try {

    cleanText =
      cleanText.replace(
        /\p{Emoji_Presentation}|\p{Extended_Pictographic}/gu,
        ""
      );

  } catch (error) {

    /*
      Older browsers may not support
      Unicode property escapes.
    */

    cleanText =
      cleanText.replace(
        /[\u{1F300}-\u{1FAFF}]/gu,
        ""
      );

  }


  cleanText =
    cleanText
      .replace(
        /\s+/g,
        " "
      )
      .trim();


  if (!cleanText) {

    statusText.textContent =
      "Ready to listen";

    character.classList.remove(
      "speaking"
    );

    updateComposerButton();

    return;

  }


  try {

    statusText.textContent =
      "🔊 Sushree is preparing to speak...";


    character.classList.remove(
      "thinking"
    );


    character.classList.add(
      "speaking"
    );


    button.textContent =
      "⏹️";


    button.classList.add(
      "stop-mode"
    );


    button.setAttribute(
      "aria-label",
      "Stop"
    );


    /* ---------------------------
       REQUEST TTS
    --------------------------- */

    const response =
      await fetch(
        WORKER_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            action: "tts",

            message: cleanText,

            voice: "Zephyr"

          })

        }
      );


    /* ---------------------------
       RESPONSE
    --------------------------- */

    const raw =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(raw);

    } catch (error) {

      console.error(
        "Invalid TTS JSON:",
        raw
      );

      throw new Error(
        "TTS returned an invalid response."
      );

    }


    console.log(
      "TTS response:",
      data
    );


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        `TTS failed with HTTP ${response.status}`
      );

    }


    if (!data.audio) {

      throw new Error(
        "No audio was returned by the Worker."
      );

    }


    /* ---------------------------
       PCM → WAV
    --------------------------- */

    const wavBlob =
      base64ToWav(
        data.audio,
        24000
      );


    const audioURL =
      URL.createObjectURL(
        wavBlob
      );


const audio = new Audio();

audio.preload = "auto";
audio.setAttribute("playsinline", "");
audio.volume = 1.0;
audio.src = audioURL;

currentAudio = audio;

/* --------------------------
   PLAY
-------------------------- */

audio.onplay = function() {

    statusText.textContent =
        "🔊 Sushree is speaking...";

};

audio.onended = function() {

    URL.revokeObjectURL(audioURL);

    if (currentAudio === audio) {
        currentAudio = null;
    }

    character.classList.remove(
        "speaking"
    );

    statusText.textContent =
        "Ready to listen";

    updateComposerButton();

};

audio.onerror = function(error) {

    console.error(
        "Audio playback error:",
        error
    );

    URL.revokeObjectURL(audioURL);

    if (currentAudio === audio) {
        currentAudio = null;
    }

    character.classList.remove(
        "speaking"
    );

    statusText.textContent =
        "⚠️ Audio playback failed";

    updateComposerButton();

};

/* --------------------------
   START PLAYBACK
-------------------------- */

try {

    await audio.play();

} catch (error) {

    console.error(
        "Sushree audio.play() failed:",
        error
    );

    console.error(
        "Error name:",
        error?.name
    );

    console.error(
        "Error message:",
        error?.message
    );

    URL.revokeObjectURL(audioURL);

    if (currentAudio === audio) {
        currentAudio = null;
    }

    character.classList.remove(
        "speaking"
    );

    statusText.textContent =
        "⚠️ " +
        (error?.message ||
         "Voice unavailable");

    updateComposerButton();

}
    
}


/* =========================================================
   STOP EVERYTHING
   ========================================================= */

function stopEverything() {

  /* ---------------------------
     STOP MICROPHONE
  --------------------------- */

  if (recognition) {

    try {

      recognition.abort();

    } catch (error) {}

    recognition = null;

  }


  /* ---------------------------
     STOP AUDIO
  --------------------------- */

  if (currentAudio) {

    try {

      currentAudio.pause();

      currentAudio.currentTime = 0;

    } catch (error) {}

    currentAudio = null;

  }


  /*
    Also stop browser speech
    synthesis if anything is active.
  */

  if (
    "speechSynthesis" in window
  ) {

    try {

      speechSynthesis.cancel();

    } catch (error) {}

  }


  /* ---------------------------
     RESET CHARACTER
  --------------------------- */

  character.classList.remove(
    "listening"
  );

  character.classList.remove(
    "thinking"
  );

  character.classList.remove(
    "speaking"
  );


  /* ---------------------------
     RESET STATUS
  --------------------------- */

  statusText.textContent =
    "Ready to listen";


  /* ---------------------------
     RESET BUTTON
  --------------------------- */

  updateComposerButton();

}


/* =========================================================
   INITIAL STATE
   ========================================================= */

updateComposerButton();

statusText.textContent =
  "Ready to listen";


/* =========================================================
   DEBUG INFORMATION
   ========================================================= */

console.log(
  "Sushree AI initialized successfully."
);

console.log(
  "Worker:",
  WORKER_URL
);
