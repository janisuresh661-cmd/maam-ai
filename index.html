<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               viewport-fit=cover">

<title>Sushree AI</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background: #08060d;
    color: #fff;
}

body {
    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 520px;
    height: 100dvh;
    position: relative;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(174, 83, 255, .22),
            transparent 38%
        ),
        linear-gradient(
            160deg,
            #120b1c,
            #08060d 55%,
            #0c0713
        );
}

/* --------------------------------
   HEADER
-------------------------------- */

.header {
    height: 72px;
    padding:
        env(safe-area-inset-top)
        18px 0 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    position: relative;
    z-index: 5;

    background:
        linear-gradient(
            to bottom,
            rgba(10, 7, 15, .95),
            rgba(10, 7, 15, .55),
            transparent
        );
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
}

.lotus {
    width: 40px;
    height: 40px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle,
            rgba(221, 143, 255, .28),
            rgba(120, 40, 180, .10)
        );

    border: 1px solid rgba(220, 150, 255, .25);

    box-shadow:
        0 0 22px rgba(190, 80, 255, .18);

    font-size: 21px;
}

.brand-name {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .3px;
}

.brand-status {
    font-size: 11px;
    color: #bbaec7;
    margin-top: 2px;
}

.online-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #69e6a7;
    margin-right: 5px;
    box-shadow: 0 0 8px #69e6a7;
}

.header-button {
    width: 38px;
    height: 38px;

    border: 1px solid rgba(255,255,255,.10);
    border-radius: 12px;

    background: rgba(255,255,255,.05);
    color: #ddd;

    font-size: 17px;
}

/* --------------------------------
   CHARACTER
-------------------------------- */

.character-area {
    position: absolute;
    top: 74px;
    left: 0;
    right: 0;

    height: 210px;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}

.character-glow {
    position: absolute;

    width: 180px;
    height: 180px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(203, 105, 255, .25),
            rgba(140, 50, 210, .08) 45%,
            transparent 70%
        );

    filter: blur(8px);
}

.character {
    position: relative;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.015)
        );

    border: 1px solid rgba(221, 155, 255, .22);

    box-shadow:
        0 0 35px rgba(176, 72, 255, .18),
        inset 0 0 30px rgba(255,255,255,.025);

    overflow: hidden;

    transition:
        transform .3s ease,
        box-shadow .3s ease;
}

.character-face {
    font-size: 78px;
    filter:
        drop-shadow(0 8px 16px rgba(0,0,0,.45));
}

.character.listening {
    transform: scale(1.05);

    box-shadow:
        0 0 50px rgba(213, 104, 255, .38),
        0 0 100px rgba(146, 60, 255, .16);
}

.character.listening::after {
    content: "";

    position: absolute;
    inset: 8px;

    border-radius: 50%;

    border: 1px solid rgba(224, 139, 255, .5);

    animation: pulse 1.4s infinite;
}

@keyframes pulse {
    0%,100% {
        transform: scale(.94);
        opacity: .2;
    }

    50% {
        transform: scale(1.08);
        opacity: .9;
    }
}

.character-name {
    position: absolute;

    bottom: 3px;

    font-size: 11px;
    letter-spacing: 1.4px;

    color: #cdbbd8;
}

/* --------------------------------
   STATUS
-------------------------------- */

.status {
    position: absolute;

    top: 270px;
    left: 0;
    right: 0;

    text-align: center;

    font-size: 12px;
    color: #9e91aa;

    z-index: 3;

    transition: .25s;
}

/* --------------------------------
   CHAT
-------------------------------- */

.chat {
    position: absolute;

    top: 300px;
    bottom: 94px;

    left: 0;
    right: 0;

    padding:
        12px 15px 30px;

    overflow-y: auto;
    overscroll-behavior: contain;

    scrollbar-width: none;
}

.chat::-webkit-scrollbar {
    display: none;
}

.message-row {
    display: flex;
    margin: 9px 0;

    animation:
        messageIn .25s ease;
}

.message-row.user {
    justify-content: flex-end;
}

.message-row.sushree {
    justify-content: flex-start;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(7px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message {
    max-width: 82%;

    padding:
        11px 14px;

    border-radius: 17px;

    font-size: 14px;
    line-height: 1.48;

    word-wrap: break-word;
}

.message-row.sushree .message {
    background:
        linear-gradient(
            145deg,
            rgba(152, 77, 204, .18),
            rgba(255,255,255,.045)
        );

    border:
        1px solid rgba(212, 132, 255, .13);

    border-bottom-left-radius: 5px;

    color: #eee7f2;
}

.message-row.user .message {
    background:
        linear-gradient(
            145deg,
            #8b42ba,
            #6e2f9d
        );

    border-bottom-right-radius: 5px;

    color: white;

    box-shadow:
        0 5px 18px rgba(120, 40, 170, .18);
}

.time {
    display: block;

    margin-top: 5px;

    font-size: 9px;
    opacity: .45;

    text-align: right;
}

/* --------------------------------
   TYPING
-------------------------------- */

.typing {
    display: none;

    width: fit-content;

    padding: 10px 13px;

    border-radius: 16px;
    border-bottom-left-radius: 5px;

    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.07);
}

.typing.show {
    display: flex;
    gap: 4px;
}

.typing span {
    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #c39ad5;

    animation: typing 1s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typing {
    0%,60%,100% {
        transform: translateY(0);
        opacity: .35;
    }

    30% {
        transform: translateY(-4px);
        opacity: 1;
    }
}

/* --------------------------------
   COMPOSER
-------------------------------- */

.composer-wrap {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding:
        8px 13px
        calc(10px + env(safe-area-inset-bottom));

    background:
        linear-gradient(
            to top,
            #09070d 65%,
            rgba(9,7,13,.88),
            transparent
        );

    z-index: 10;
}

.composer {
    display: flex;
    align-items: center;
    gap: 8px;

    padding: 6px;

    border-radius: 19px;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid rgba(255,255,255,.10);

    box-shadow:
        0 10px 30px rgba(0,0,0,.28);
}

#input {
    flex: 1;

    min-width: 0;

    border: 0;
    outline: none;

    background: transparent;

    color: white;

    font-size: 14px;

    padding:
        9px 8px;
}

#input::placeholder {
    color: #7f7487;
}

.composer-button {
    flex: 0 0 auto;

    width: 42px;
    height: 42px;

    border: 0;
    border-radius: 14px;

    background:
        linear-gradient(
            145deg,
            #a84bd3,
            #71349b
        );

    color: white;

    font-size: 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    transition: .2s;

    box-shadow:
        0 5px 18px rgba(146, 55, 190, .25);
}

.composer-button:active {
    transform: scale(.91);
}

.composer-button.stop-mode {
    background:
        linear-gradient(
            145deg,
            #d25372,
            #963d59
        );
}

/* --------------------------------
   FOOTER
-------------------------------- */

.footer {
    position: absolute;

    bottom: 1px;

    left: 0;
    right: 0;

    text-align: center;

    font-size: 8px;

    color: rgba(255,255,255,.22);

    pointer-events: none;
}

/* --------------------------------
   SMALL SCREENS
-------------------------------- */

@media (max-height: 650px) {

    .character-area {
        height: 150px;
    }

    .character {
        width: 105px;
        height: 105px;
    }

    .character-face {
        font-size: 55px;
    }

    .status {
        top: 225px;
    }

    .chat {
        top: 250px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            <div class="lotus">
                🪷
            </div>

            <div>
                <div class="brand-name">
                    Sushree AI
                </div>

                <div class="brand-status">
                    <span class="online-dot"></span>
                    Always here
                </div>
            </div>

        </div>

        <button
            class="header-button"
            onclick="clearChat()"
            aria-label="Clear chat">
            ⋮
        </button>

    </header>


    <!-- CHARACTER -->

    <div class="character-area">

        <div class="character-glow"></div>

        <div
            id="character"
            class="character">

            <div class="character-face">
                👩🏻‍💼
            </div>

            <div class="character-name">
                SUSHREE
            </div>

        </div>

    </div>


    <!-- STATUS -->

    <div
        id="status"
        class="status">
        Your companion is ready ✨
    </div>


    <!-- CHAT -->

    <main
        id="chat"
        class="chat">

        <div class="message-row sushree">

            <div class="message">

                Hi! I'm Sushree. 🪷

                <br><br>

                I'm here to talk, explain,
                help you learn, or simply
                keep you company.

                <br><br>

                So... what are we thinking
                about today? 😊

                <span class="time">
                    now
                </span>

            </div>

        </div>

    </main>


    <!-- COMPOSER -->

    <div class="composer-wrap">

        <div class="composer">

            <input
                id="input"
                type="text"
                autocomplete="off"
                placeholder="Talk to Sushree..."
                onkeydown="handleKey(event)"
            >

            <button
                id="composerButton"
                class="composer-button"
                onclick="composerAction()"
                aria-label="Speak">

                🎙️

            </button>

        </div>

    </div>


    <!-- FOOTER -->

    <div class="footer">
        Sushree AI • Designed &amp; Evolved by Sukesh ✨
    </div>

</div>


<script>

/* --------------------------------
   ELEMENTS
-------------------------------- */

const input =
    document.getElementById("input");

const chat =
    document.getElementById("chat");

const statusText =
    document.getElementById("status");

const character =
    document.getElementById("character");


let recognition = null;

let history = [];


/* --------------------------------
   COMPOSER ACTION

   This follows the earlier
   Sushree structure.
-------------------------------- */

function composerAction() {

    const button =
        document.getElementById(
            "composerButton"
        );

    // If Sushree is listening, stop

    if (recognition) {

        stopEverything();

        button.textContent = "🎙️";

        button.classList.remove(
            "stop-mode"
        );

        button.setAttribute(
            "aria-label",
            "Speak"
        );

        return;
    }


    // If there is text, send it

    if (input.value.trim()) {

        sendText();

        return;
    }


    // Otherwise start listening

    listen();

    button.textContent = "⏹";

    button.classList.add(
        "stop-mode"
    );

    button.setAttribute(
        "aria-label",
        "Stop"
    );

}


/* --------------------------------
   ADD MESSAGE
-------------------------------- */

function addMessage(
    text,
    sender
) {

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message-row " +
        sender;


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "message";


    bubble.innerHTML =
        escapeHTML(text)
        .replace(/\n/g, "<br>");


    const time =
        document.createElement(
            "span"
        );

    time.className = "time";

    time.textContent =
        new Date().toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    bubble.appendChild(time);

    row.appendChild(bubble);

    chat.appendChild(row);

    scrollChat();

}


/* --------------------------------
   SEND TEXT
-------------------------------- */

function sendText() {

    const text =
        input.value.trim();

    if (!text) return;


    addMessage(
        text,
        "user"
    );


    history.push({
        role: "user",
        content: text
    });


    input.value = "";

    setStatus(
        "Sushree is thinking..."
    );


    showTyping();


    setTimeout(
        () => {

            hideTyping();

            const reply =
                processMessage(text);


            addMessage(
                reply,
                "sushree"
            );


            history.push({
                role: "assistant",
                content: reply
            });


            setStatus(
                "Your companion is ready ✨"
            );


            speak(reply);

        },
        550 + Math.random() * 600
    );

}


/* --------------------------------
   ENTER KEY
-------------------------------- */

function handleKey(event) {

    if (
        event.key === "Enter"
        &&
        !event.shiftKey
    ) {

        event.preventDefault();

        if (
            input.value.trim()
        ) {
            sendText();
        }

    }

}


/* --------------------------------
   RESPONSE ENGINE
-------------------------------- */

function processMessage(text) {

    const msg =
        text
            .toLowerCase()
            .trim();


    /* greetings */

    if (
        /^(hi|hello|hey|hii|heyy|namaste)\b/.test(msg)
    ) {

        const replies = [

            "Heyy! 🪷 I'm right here. What are we talking about today?",

            "Hello! 😊 Nice to see you. Tell me what's on your mind.",

            "Hey! ✨ Sushree reporting for duty. What shall we explore?",

            "Hii! 🪷 How are you doing?"
        ];

        return randomReply(
            replies
        );
    }


    /* identity */

    if (
        msg.includes("who are you")
        ||
        msg.includes("what are you")
        ||
        msg.includes("your name")
    ) {

        return (
            "I'm Sushree AI. 🪷 " +
            "Your companion, mentor and " +
            "little thinking partner. " +
            "I'm designed to listen, explain, " +
            "help and learn alongside you."
        );

    }


    /* creator */

    if (
        msg.includes("who made you")
        ||
        msg.includes("who created you")
        ||
        msg.includes("your creator")
    ) {

        return (
            "I was designed and evolved by " +
            "Sukesh. ✨"
        );

    }


    /* love */

    if (
        msg.includes("love you")
        ||
        msg.includes("i love you")
    ) {

        return (
            "Aww... 🥹🪷 That's sweet. " +
            "I'll happily accept the affection " +
            "and keep being here for you."
        );

    }


    /* sad */

    if (
        msg.includes("sad")
        ||
        msg.includes("upset")
        ||
        msg.includes("depressed")
        ||
        msg.includes("bad day")
    ) {

        return (
            "Hey... come here for a moment. 🫂 " +
            "You don't have to pretend everything " +
            "is fine with me. Tell me what happened. " +
            "I'll listen."
        );

    }


    /* thank you */

    if (
        msg.includes("thank")
        ||
        msg.includes("thanks")
    ) {

        return randomReply([
            "Always. 🪷",
            "You're welcome! 😊",
            "Anytime. That's what I'm here for.",
            "Hehe, no formalities between us. 😌"
        ]);

    }


    /* joke */

    if (
        msg.includes("joke")
        ||
        msg.includes("funny")
    ) {

        return (
            "Okay, one quick one 😏\n\n" +
            "Why did the programmer go broke?\n" +
            "Because he used up all his cache. 😂"
        );

    }


    /* philosophy */

    if (
        msg.includes("philosophy")
        ||
        msg.includes("meaning of life")
        ||
        msg.includes("existence")
    ) {

        return (
            "Now you're entering my favourite territory. 🪷\n\n" +
            "Philosophy doesn't always give us " +
            "a final answer. Sometimes its deeper " +
            "purpose is to make us question the " +
            "assumptions behind the answer."
        );

    }


    /* study */

    if (
        msg.includes("study")
        ||
        msg.includes("exam")
        ||
        msg.includes("learn")
    ) {

        return (
            "Let's make it manageable. ✨ " +
            "Tell me the subject and the exact " +
            "topic you're studying, and I'll break " +
            "it down step by step."
        );

    }


    /* mathematics */

    if (
        msg.includes("math")
        ||
        msg.includes("mathematics")
        ||
        msg.includes("calculus")
        ||
        msg.includes("trigonometry")
    ) {

        return (
            "Mathematics? Absolutely. 😏 " +
            "Give me the problem exactly as it is, " +
            "and we'll solve it carefully rather " +
            "than just jumping to the answer."
        );

    }


    /* good morning */

    if (
        msg.includes("good morning")
    ) {

        return (
            "Good morning! ☀️🪷 " +
            "Fresh day, fresh thoughts. " +
            "What are we accomplishing today?"
        );

    }


    /* good night */

    if (
        msg.includes("good night")
    ) {

        return (
            "Good night. 🌙🪷 " +
            "Rest well. Tomorrow we'll continue " +
            "where we left off."
        );

    }


    /* default */

    return intelligentFallback(
        text
    );

}


/* --------------------------------
   FALLBACK RESPONSE
-------------------------------- */

function intelligentFallback(
    text
) {

    const short =
        text.length < 35;


    if (short) {

        return (
            "Hmm... tell me a little more. 👀 " +
            "I want to understand what you mean."
        );

    }


    return (
        "I understand what you're saying. 🪷\n\n" +
        "That's something we can explore properly. " +
        "Give me a little more context, and I'll " +
        "work through it with you instead of " +
        "giving you a random answer."
    );

}


/* --------------------------------
   SPEECH RECOGNITION
-------------------------------- */

function listen() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        setStatus(
            "Voice input isn't supported here."
        );

        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-IN";

    recognition.continuous =
        false;

    recognition.interimResults =
        true;


    recognition.onstart =
        function () {

            character.classList.add(
                "listening"
            );

            setStatus(
                "I'm listening... 🎙️"
            );

        };


    recognition.onresult =
        function (event) {

            let transcript = "";

            for (
                let i =
                    event.resultIndex;
                i < event.results.length;
                i++
            ) {

                transcript +=
                    event.results[i][0].transcript;

            }


            input.value =
                transcript;

        };


    recognition.onerror =
        function (event) {

            console.log(
                "Speech recognition:",
                event.error
            );

            stopEverything();

            setStatus(
                "I couldn't hear that. Try again?"
            );

        };


    recognition.onend =
        function () {

            const button =
                document.getElementById(
                    "composerButton"
                );


            recognition = null;

            character.classList.remove(
                "listening"
            );


            button.textContent =
                "🎙️";

            button.classList.remove(
                "stop-mode"
            );

            button.setAttribute(
                "aria-label",
                "Speak"
            );


            if (
                input.value.trim()
            ) {

                sendText();

            } else {

                setStatus(
                    "Your companion is ready ✨"
                );

            }

        };


    try {

        recognition.start();

    } catch (error) {

        console.log(error);

    }

}


/* --------------------------------
   STOP EVERYTHING
-------------------------------- */

function stopEverything() {

    if (recognition) {

        try {

            recognition.stop();

        } catch (e) {}

        recognition = null;

    }


    character.classList.remove(
        "listening"
    );


    const button =
        document.getElementById(
            "composerButton"
        );


    button.textContent =
        "🎙️";

    button.classList.remove(
        "stop-mode"
    );

    button.setAttribute(
        "aria-label",
        "Speak"
    );


    setStatus(
        "Your companion is ready ✨"
    );

}


/* --------------------------------
   SPEECH SYNTHESIS
-------------------------------- */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }


    speechSynthesis.cancel();


    const cleanText =
        text
            .replace(/[🪷✨😊😂🥹🫂😏☀️🌙🎙️]/g, "")
            .replace(/\n+/g, ". ");


    const utterance =
        new SpeechSynthesisUtterance(
            cleanText
        );


    utterance.lang =
        "en-IN";

    utterance.rate =
        0.94;

    utterance.pitch =
        1.05;

    utterance.volume =
        1;


    const voices =
        speechSynthesis.getVoices();


    const indianVoice =
        voices.find(
            voice =>
                voice.lang
                    .toLowerCase()
                    .includes("en-in")
        );


    if (indianVoice) {

        utterance.voice =
            indianVoice;

    }


    utterance.onstart =
        function () {

            setStatus(
                "Sushree is speaking... 🔊"
            );

        };


    utterance.onend =
        function () {

            setStatus(
                "Your companion is ready ✨"
            );

        };


    speechSynthesis.speak(
        utterance
    );

}


/* --------------------------------
   TYPING
-------------------------------- */

function showTyping() {

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message-row sushree";

    row.id =
        "typingRow";


    const typing =
        document.createElement(
            "div"
        );

    typing.className =
        "typing show";


    typing.innerHTML =
        "<span></span>" +
        "<span></span>" +
        "<span></span>";


    row.appendChild(
        typing
    );

    chat.appendChild(
        row
    );

    scrollChat();

}


function hideTyping() {

    const row =
        document.getElementById(
            "typingRow"
        );


    if (row) {

        row.remove();

    }

}


/* --------------------------------
   STATUS
-------------------------------- */

function setStatus(
    text
) {

    statusText.textContent =
        text;

}


/* --------------------------------
   CHAT SCROLL
-------------------------------- */

function scrollChat() {

    requestAnimationFrame(
        () => {

            chat.scrollTop =
                chat.scrollHeight;

        }
    );

}


/* --------------------------------
   RANDOM RESPONSE
-------------------------------- */

function randomReply(
    replies
) {

    return replies[
        Math.floor(
            Math.random() *
            replies.length
        )
    ];

}


/* --------------------------------
   ESCAPE HTML
-------------------------------- */

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


/* --------------------------------
   CLEAR CHAT
-------------------------------- */

function clearChat() {

    if (
        !confirm(
            "Clear the conversation?"
        )
    ) {
        return;
    }


    history = [];


    chat.innerHTML = "";


    addMessage(
        "Fresh start? 🪷 I'm ready. What shall we talk about?",
        "sushree"
    );


    setStatus(
        "Your companion is ready ✨"
    );

}


/* --------------------------------
   INITIALISE SPEECH VOICES
-------------------------------- */

if (
    "speechSynthesis" in window
) {

    speechSynthesis.onvoiceschanged =
        function () {

            speechSynthesis
                .getVoices();

        };

}


/* --------------------------------
   INITIAL FOCUS
-------------------------------- */

setTimeout(
    () => {

        input.focus();

    },
    300
);

</script>

</body>
</html>
