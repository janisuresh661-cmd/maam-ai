body {

.app {

}

.header {
  text-align: center;
}

.header h1 {
  margin: 5px 0;
  font-size: 32px;

}

.header p {
  margin: 5px 0 18px;

}

.character {
  width: 170px;
  height: 170px;
  margin: 5px auto 15px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 80px;
  background: radial-gradient(circle, #334b78, #08111f);
  border: 3px solid #5ce8ff;
  box-shadow: 0 0 35px rgba(92, 232, 255, .35);
  transition: .3s;
    overflow: hidden;
}

.character img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
}

.character.listening {
  animation: listenPulse 1.2s infinite;
}

  .character.thinking {
  animation: thinkingPulse 1.5s infinite ease-in-out;
}

@keyframes thinkingPulse {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 0 35px rgba(92, 232, 255, .35);
  }

  50% {
    transform: scale(1.025);
    box-shadow: 0 0 48px rgba(167, 139, 250, .65);
  }
}
.character.speaking {
  animation: speakPulse .45s infinite alternate;
}

@keyframes listenPulse {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 0 35px rgba(92, 232, 255, .35);
  }

  50% {
    transform: scale(1.04);
    box-shadow: 0 0 60px rgba(92, 232, 255, .85);
  }
}

@keyframes speakPulse {
  from {
    transform: scale(1);
    box-shadow: 0 0 35px rgba(92, 232, 255, .35);
  }

  to {
    transform: scale(1.045);
    box-shadow: 0 0 55px rgba(92, 232, 255, .75);
  }
}

.status {
  text-align: center;
  min-height: 22px;
  color: #67e8f9;
  margin-bottom: 12px;
}

.chat {
  flex: 1;
  min-height: 220px;
  max-height: 340px;
  overflow-y: auto;
  padding: 5px;
}

.message {
  padding: 12px 15px;
  margin: 9px 0;
  border-radius: 16px;
  line-height: 1.5;
  max-width: 85%;
}

.sushree {
  background: #1e293b;
  margin-right: 35px;
}

.user {
  background: #164e63;
  margin-left: 35px;
  text-align: right;
}

/* Modern AI Composer */

.composer {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding: 6px 7px 6px 16px;
  border: 1px solid #334155;
  border-radius: 28px;
  background: #0f172a;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
  transition: border-color 0.25s ease, box-shadow 0.25s ease;
}

.composer:focus-within {
  border-color: #5ce8ff;
  box-shadow: 0 0 0 3px rgba(92, 232, 255, 0.08);
}

.composer input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  font-size: 15px;
  padding: 9px 0;
}

.composer input::placeholder {
  color: #64748b;
}

.composer-button {
  width: 42px;
  height: 42px;
  min-width: 42px;
  padding: 0;
  border: none;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #5ce8ff;
  color: #08111f;
  font-size: 18px;
  cursor: pointer;
  box-shadow: 0 2px 10px rgba(92, 232, 255, 0.25);
  transition: transform 0.2s ease,
              background 0.2s ease,
              box-shadow 0.2s ease;
}

.composer-button:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 16px rgba(92, 232, 255, 0.35);
}

.composer-button:active {
  transform: scale(0.92);
}

.composer-button.stop-mode {
  background: #475569;
  color: white;
  box-shadow: 0 2px 10px rgba(71, 85, 105, 0.35);
}

.footer {
  text-align: center;
  margin-top: 14px;
  color: #64748b;
  font-size: 11px;
}
/* Sushree feels alive */
.character {
  animation: naturalBreathing 4s ease-in-out infinite;
}

.character img {
  transition: transform 0.4s ease, filter 0.4s ease;
}

/* Gentle natural breathing */
@keyframes naturalBreathing {
  0%, 100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.015);
  }
}

/* Soft idle glow */
.character:not(.listening):not(.thinking):not(.speaking) {
  box-shadow: 0 0 35px rgba(92, 232, 255, 0.35);
}

/* Thinking state */
.character.thinking img {
  transform: scale(1.02);
  filter: brightness(1.05);
}

/* Speaking state */
.character.speaking img {
  transform: scale(1.025);
  filter: brightness(1.1);
}

/* Listening state */
.character.listening img {
  transform: scale(1.015);
  filter: brightness(1.08);

const input = document.getElementById("input");

const statusText = document.getElementById("status");
const character = document.getElementById("character");

let recognition = null;
let history = [];

// Sushree's local memory
let memory = JSON.parse(
  localStorage.getItem("sushreeMemory") || "{}"
);
  function saveMemory() {
  localStorage.setItem("sushreeMemory", JSON.stringify(memory));
}

function remember(key, value) {
  memory[key] = value;
  saveMemory();
}
  
function composerAction() {
  const button = document.getElementById("composerButton");

  // Stop listening or speaking
  if (recognition || speechSynthesis.speaking) {
    stopEverything();
    return;
  }

  // Send typed message
  if (input.value.trim()) {
    sendText();
    return;
  }

  // Otherwise start microphone
  listen();

  button.textContent = "⏹";
  button.classList.add("stop-mode");
  button.setAttribute("aria-label", "Stop");
}

/* ---------------------------
   ADD MESSAGE
--------------------------- */

function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type;

  message.innerHTML = text
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/^### (.*)$/gm, "<h3>$1</h3>")
    .replace(/^## (.*)$/gm, "<h2>$1</h2>")
    .replace(/^# (.*)$/gm, "<h1>$1</h1>")
    .replace(/\n/g, "<br>");

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}


/* ---------------------------
   SPEECH RECOGNITION
--------------------------- */

function listen() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    statusText.textContent =
      "Speech recognition isn't supported here.";

    return;
  }

  recognition = new SpeechRecognition();

  /*
    We begin with English-India.
    Later, the real AI backend will
    handle automatic multilingual
    understanding.
  */

  recognition.lang = "en-IN";

  recognition.continuous = false;

  recognition.interimResults = false;

  recognition.onstart = function() {

    statusText.textContent =
      "🎙️ Listening...";

    character.classList.add("listening");
  };

  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;

    character.classList.remove("listening");

    input.value = "";

    addMessage(text, "user");

    processMessage(text);
  };

  recognition.onerror = function() {

  character.classList.remove("listening");

  recognition = null;

  statusText.textContent =
    "I couldn't hear that. Try again.";

  const button = document.getElementById("composerButton");

  button.textContent = "🎙️";
  button.classList.remove("stop-mode");
  button.setAttribute("aria-label", "Speak");
};

  recognition.onend = function() {

  character.classList.remove("listening");

  recognition = null;

  const button = document.getElementById("composerButton");

  button.textContent = "🎙️";
  button.classList.remove("stop-mode");
  button.setAttribute("aria-label", "Speak");
};

  try {

    recognition.start();

  } catch(error) {

    console.log(error);
  }
}


/* ---------------------------
   TEXT MESSAGE
--------------------------- */

function sendText() {

  const text = input.value.trim();

  if (!text) return;

  input.value = "";

  addMessage(text, "user");

  processMessage(text);
}

function updateComposerButton() {
  const button = document.getElementById("composerButton");

    return;
  }

  if (input.value.trim()) {

  } else {
    button.textContent = "🎙️";
    button.classList.remove("stop-mode");
    button.setAttribute("aria-label", "Speak");
  }
}

input.addEventListener("input", updateComposerButton);

async function processMessage(text) {
  statusText.textContent = "🧠 Thinking...";
  // 🧠 Remember user's name
const nameMatch = text.match(

  ? `Known information about the user: ${JSON.stringify(memory)}`

  try {
    const response = await fetch(
      "https://spring-cake-3e86.janisuresh661.workers.dev",

        },
        body: JSON.stringify({

    console.log("Worker response:", data);

    if (!response.ok) {

    );

    history.push({

    history.push({
        role: "model",

        data.error || "Sorry, I couldn't get a response right now.",

  } catch (error) {
    console.error("Sushree API Error:", error);

    addMessage(

/* ---------------------------
   TEXT TO SPEECH
--------------------------- */

async function speak(text) {
    const WORKER_URL =
        "https://spring-cake-3e86.janisuresh661.workers.dev";

    const button = document.getElementById("composerButton");

    try {
        if ("speechSynthesis" in window) {
            speechSynthesis.cancel();
        }

        const cleanText = text
            .replace(/\p{Emoji_Presentation}|\p{Extended_Pictographic}/gu, "")
            .replace(/\s+/g, " ")
            .trim();

        if (!cleanText) return;

        statusText.textContent = "🔊 Sushree is speaking...";
        character.classList.add("speaking");

        if (button) {
            button.textContent = "⏹️";
            button.classList.add("stop-mode");
            button.setAttribute("aria-label", "Stop");
        }

        const response = await fetch(WORKER_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                action: "tts",
                message: cleanText,
                voice: "Zephyr"
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success || !data.audio) {
            throw new Error(
                data.error || "TTS audio was not returned."
            );
        }

        const wavBlob = pcmBase64ToWavBlob(
            data.audio,
            24000,
            1,
            16
        );

        const audioUrl = URL.createObjectURL(wavBlob);
        const audio = new Audio(audioUrl);

        window.sushreeAudio = audio;

        audio.onended = function () {
            URL.revokeObjectURL(audioUrl);
            window.sushreeAudio = null;
            statusText.textContent = "Ready to listen";
            character.classList.remove("speaking");

            if (button) {
                button.textContent = "🎙️";
                button.classList.remove("stop-mode");
                button.setAttribute("aria-label", "Speak");
            }
        };

        audio.onerror = function () {
            URL.revokeObjectURL(audioUrl);
            window.sushreeAudio = null;
            statusText.textContent = "Ready to listen";
            character.classList.remove("speaking");

            if (button) {
                button.textContent = "🎙️";
                button.classList.remove("stop-mode");
                button.setAttribute("aria-label", "Speak");
            }
        };

        await audio.play();

    } catch (error) {
        console.error("Sushree TTS error:", error);
        statusText.textContent = "Voice unavailable";
        character.classList.remove("speaking");

        if (button) {
            button.textContent = "🎙️";
            button.classList.remove("stop-mode");
            button.setAttribute("aria-label", "Speak");
        }
    }
}

function base64ToWav(base64, sampleRate = 24000) {

  const binary = atob(base64);
  const pcm = new Uint8Array(binary.length);

  for (let i = 0; i < binary.length; i++) {
    pcm[i] = binary.charCodeAt(i);
  }

  const dataLength = pcm.length;
  const buffer = new ArrayBuffer(44 + dataLength);
  const view = new DataView(buffer);

  function writeString(offset, string) {
    for (let i = 0; i < string.length; i++) {
      view.setUint8(offset + i, string.charCodeAt(i));
    }
  }

  // WAV header
  writeString(0, "RIFF");
  view.setUint32(4, 36 + dataLength, true);
  writeString(8, "WAVE");

  writeString(12, "fmt ");
  view.setUint32(16, 16, true);       // PCM chunk size
  view.setUint16(20, 1, true);        // PCM format
  view.setUint16(22, 1, true);        // Mono
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);       // 16-bit

  writeString(36, "data");
  view.setUint32(40, dataLength, true);

  // PCM data
  new Uint8Array(buffer, 44).set(pcm);

  return new Blob([buffer], {
    type: "audio/wav"
  });
}

      addMessage(
        data.error ||
        "Sorry, I couldn't get a response right now.",
        "assistant"
      );

      character.classList.remove(
        "thinking"
      );
    }


  } catch (error) {

    console.error(
      "Sushree API Error:",
      error
    );


    character.classList.remove(
      "thinking"
    );


    addMessage(
      `Sorry, something went wrong: ${error.message}`,
      "assistant"
    );
  }


  if (!currentAudio) {

    statusText.textContent =
      "🟢 Online";

  }
}


/* ---------------------------
   PCM BASE64 → WAV
--------------------------- */

function base64ToWav(
  base64,
  sampleRate = 24000
) {

  const binary =
    atob(base64);

  const pcm =
    new Uint8Array(
      binary.length
    );


  for (
    let i = 0;
    i < binary.length;
    i++
  ) {

    pcm[i] =
      binary.charCodeAt(i);
  }


  const dataLength =
    pcm.length;

  const buffer =
    new ArrayBuffer(
      44 + dataLength
    );

  const view =
    new DataView(buffer);


  function writeString(
    offset,
    string
  ) {

    for (
      let i = 0;
      i < string.length;
      i++
    ) {

      view.setUint8(
        offset + i,
        string.charCodeAt(i)
      );
    }
  }


  /* WAV header */

  writeString(
    0,
    "RIFF"
  );

  view.setUint32(
    4,
    36 + dataLength,
    true
  );

  writeString(
    8,
    "WAVE"
  );


  writeString(
    12,
    "fmt "
  );

  view.setUint32(
    16,
    16,
    true
  );

  view.setUint16(
    20,
    1,
    true
  );

  view.setUint16(
    22,
    1,
    true
  );

  view.setUint32(
    24,
    sampleRate,
    true
  );

  view.setUint32(
    28,
    sampleRate * 2,
    true
  );

  view.setUint16(
    32,
    2,
    true
  );

  view.setUint16(
    34,
    16,
    true
  );


  writeString(
    36,
    "data"
  );

  view.setUint32(
    40,
    dataLength,
    true
  );


  new Uint8Array(
    buffer,
    44
  ).set(pcm);


  return new Blob(
    [buffer],
    {
      type: "audio/wav"
    }
  );
}


/* ---------------------------
   TEXT TO SPEECH
--------------------------- */

async function speak(text) {

  if (
    !text ||
    !text.trim()
  ) {
    return;
  }


  try {

    /* Stop previous audio */

    if (currentAudio) {

      currentAudio.pause();

      currentAudio.currentTime =
        0;

      currentAudio = null;
    }


    statusText.textContent =
      "🔊 Sushree is preparing to speak...";


    character.classList.add(
      "speaking"
    );


    button.textContent =
      "⏹️";

    button.classList.add(
      "stop-mode"
    );

    button.setAttribute(
      "aria-label",
      "Stop"
    );


    const response =
      await fetch(
        WORKER_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            action: "tts",

            message: text,

            voice: "Zephyr"

          })
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success ||
      !data.audio
    ) {

      console.error(
        "TTS error:",
        data
      );

      throw new Error(
        data.error ||
        "TTS audio was not returned."
      );
    }


    /* Gemini returns raw PCM */

    const wavBlob =
      base64ToWav(
        data.audio,
        24000
      );


    const audioURL =
      URL.createObjectURL(
        wavBlob
      );


    currentAudio =
      new Audio(audioURL);


    currentAudio.onplay =
      function() {

        statusText.textContent =
          "🔊 Sushree is speaking...";
      };


    currentAudio.onended =
      function() {

        statusText.textContent =
          "Ready to listen";

        character.classList.remove(
          "speaking"
        );

        URL.revokeObjectURL(
          audioURL
        );

        currentAudio =
          null;

        updateComposerButton();
      };


    currentAudio.onerror =
      function(error) {

        console.error(
          "Audio playback error:",
          error
        );

        statusText.textContent =
          "⚠️ Audio playback error";

        character.classList.remove(
          "speaking"
        );

        URL.revokeObjectURL(
          audioURL
        );

        currentAudio =
          null;

        updateComposerButton();
      };


    await currentAudio.play();


  } catch (error) {

    console.error(
      "Sushree TTS error:",
      error
    );


    statusText.textContent =
      "⚠️ Voice unavailable";

    character.classList.remove(
      "speaking"
    );


    currentAudio =
      null;

    updateComposerButton();
  }
}


/* ---------------------------
   STOP EVERYTHING
--------------------------- */

function stopEverything() {

  /* Stop microphone */

  if (recognition) {

    try {

      recognition.stop();

    } catch (error) {}

  }

  recognition =
    null;


  /* Stop TTS */

  if (currentAudio) {

    currentAudio.pause();

    currentAudio.currentTime =
      0;

    currentAudio =
      null;
  }


  /* Stop browser speech synthesis
     just in case */

  if (
    "speechSynthesis" in window
  ) {

    speechSynthesis.cancel();
  }


  character.classList.remove(
    "listening"
  );

  character.classList.remove(
    "thinking"
  );

  character.classList.remove(
    "speaking"
  );


  statusText.textContent =
    "Ready to listen";


  updateComposerButton();
}


/* ---------------------------
   ENTER KEY
--------------------------- */

input.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      sendText();
    }
  }
);


/* ---------------------------
   INITIAL STATE
--------------------------- */

updateComposerButton();

</script>
